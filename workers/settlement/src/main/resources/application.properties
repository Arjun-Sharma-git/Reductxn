spring.application.name=reductxn-settlement

# No HTTP surface. Stated rather than left to the absence of a web starter, because the absence is a build
# file detail and this is a property of the module: its README says "public surface: none", and the day
# somebody adds a starter for an actuator they should meet this line.
spring.main.web-application-type=none

# --- Data access -----------------------------------------------------------------------------------
#
# Same shape as apps/api's, and for the same reasons (see platform/persistence): the application connects
# through PgBouncer, Flyway connects to Postgres directly because DDL cannot go through a transaction pooler,
# and Flyway's credentials are separate and must be given - setting spring.flyway.url stops it inheriting the
# DataSource's username and password.
#
# Two deployables run the same migrations against one schema. Flyway's own locking makes that safe, and it is
# deliberate: whichever starts first applies them, and neither owns the schema (RULE B17 - each migration
# lives beside the module that owns the table it creates).
spring.datasource.url=${REDUCTXN_DB_URL:jdbc:postgresql://localhost:6432/reductxn}
spring.datasource.username=${REDUCTXN_DB_USER:reductxn_app}
spring.datasource.password=${REDUCTXN_DB_PASSWORD:reductxn_local_only}

spring.flyway.url=${REDUCTXN_DB_DIRECT_URL:jdbc:postgresql://localhost:5432/reductxn}
spring.flyway.user=${REDUCTXN_DB_USER:reductxn_app}
spring.flyway.password=${REDUCTXN_DB_PASSWORD:reductxn_local_only}

# --- Settlement rail -------------------------------------------------------------------------------
#
# Which rail this worker submits transfer instructions to. The only value this build has is `mock`, which moves
# nothing and confirms everything, and an unknown name fails at startup rather than falling back - a worker that
# moved money through a rail nobody configured is the failure this line exists to prevent.
#
# This is the one deployment-wide choice in this module that a group's money depends on. Every other setting here
# is about where the data is or which jurisdiction's tax law applies.
reductxn.rail.name=${REDUCTXN_RAIL:mock}

# --- Driving ---------------------------------------------------------------------------------------
#
# The cadence that moves runs nobody else moves (ADR 0018). Nothing in the product triggers execution
# otherwise: a run waits in `awaiting_approval` or `awaiting_fx_funding` or `executing` until something looks
# at it, and this is the something.
#
# These are rate limits, not policy. Nothing about a settlement says how often to look at it; how often to look
# costs rail calls and database round trips, so it is configuration. `interval` is how often a pass runs,
# `window` is how stale an attempt must be before the same run may be attempted again (the guard that stops two
# instances - or two ticks - from driving one run at once), and `batch-size` bounds one pass so a backlog drains
# over several minutes rather than in one hour.
#
# Set `enabled=false` to run this worker as a scheduled job instead of a daemon: no cadence, and the command
# line does the driving (`--reductxn.command=drive`). Running both at once doubles the rail traffic.
reductxn.settlement.drive.enabled=${REDUCTXN_DRIVE_ENABLED:true}
reductxn.settlement.drive.interval=${REDUCTXN_DRIVE_INTERVAL:PT1M}
reductxn.settlement.drive.window=${REDUCTXN_DRIVE_WINDOW:PT2M}
reductxn.settlement.drive.batch-size=${REDUCTXN_DRIVE_BATCH_SIZE:50}

# --- Retrying a rail -------------------------------------------------------------------------------
#
# How long a transfer waits before the rail is offered it again, after a call the rail did not answer.
# Exponential from `base` to `cap`, and only for transfers whose calls went unanswered: any answer - including
# one that refuses the transfer - resets the count, so a rail that is working is never made to wait.
#
# The defaults are 30s, 1m, 2m, 4m, 8m, then 15m for ever, so a rail that is down for a long time is asked at
# most four times an hour per transfer.
reductxn.settlement.retry.base=${REDUCTXN_RETRY_BASE:PT30S}
reductxn.settlement.retry.cap=${REDUCTXN_RETRY_CAP:PT15M}

# The circuit breaker in front of the rail. After this many consecutive calls that went unanswered the rail is
# not called at all for the cooldown, and then exactly one call is allowed through to test it. Only *unanswered*
# calls count: a rail that answers "no" is a working rail with an opinion, and one group's insufficient funds
# must not stop everybody else's settlement.
#
# The state is in memory, so a restart starts with the breaker closed - which is what lets an operator recover a
# deployment by restarting it.
reductxn.rail.breaker.failures-before-opening=${REDUCTXN_BREAKER_FAILURES:5}
reductxn.rail.breaker.cooldown=${REDUCTXN_BREAKER_COOLDOWN:PT30S}

# --- When patience runs out ------------------------------------------------------------------------
#
# How long a rail may go unanswered before this worker stops treating it as business as usual.
#
# **This is the one setting in this file that is a judgement rather than a rate limit.** The two sections above
# say how hard the worker tries; this says when trying has stopped being the answer and a person has to decide
# something the worker cannot - whether the money a rail accepted actually moved. There is no right value: it
# depends on what the rail settles, how bad a delayed cycle is for the group waiting, and who is on call.
#
# The worker cannot resolve a silent transfer on its own. The absence of an answer is not evidence of anything
# except silence, so marking one `failed` would assert the money did not move and marking one `confirmed` would
# assert that it did. What it does instead is say so: a warning line every pass that names the transfers, the
# rail's last words and how long the silence has lasted - and `--reductxn.command=escalations` prints the same
# listing on demand (with `--reductxn.limit` to ask for more than the default fifty).
#
# Two hours is about eight unanswered calls under the default backoff: long enough for a rail to come back from
# an ordinary outage, short enough that a group is not left waiting without anybody knowing.
reductxn.settlement.escalation.after=${REDUCTXN_ESCALATION_AFTER:PT2H}

# How long a transfer may sit at a rail without being confirmed before somebody has to look at it.
#
# The second of the two judgements behind the same report, and a separate number because it is a separate question.
# The setting above is about a rail that says nothing; this one is about a rail that keeps saying "still pending" -
# it answers every call, so nothing goes unanswered, the retry counter resets on every poll, and the movement can
# sit at the rail for a week while every other measure says the transfer is healthy (V510 stores when the rail
# accepted it, and ADR 0026 records why an age measured from the most recent poll could not see it).
#
# It is deliberately shorter than the escalation default: an hour at the rail is long enough that a confirmation
# queue is not the explanation, whereas an hour of silence from a rail that may still be working through a backlog
# is not yet news. Either line puts the transfer in the same listing, which is what the person on call reads.
reductxn.settlement.reconcile.after=${REDUCTXN_RECONCILE_AFTER:PT1H}

# --- Tax -------------------------------------------------------------------------------------------
#
# Which jurisdiction's rules apply to a partition, per ADR 0006. Required with no default, exactly as in
# apps/api, and for the same reason: a deployment that has not been told its jurisdiction would resolve no
# rule, and no tax looks exactly like low tax. Here it is worse rather than better - a run that assessed no
# tax would settle a cycle for less than the group owes.
reductxn.tax.jurisdiction=${REDUCTXN_TAX_JURISDICTION}
