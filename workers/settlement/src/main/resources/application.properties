spring.application.name=reductxn-settlement

# No HTTP surface. Stated rather than left to the absence of a web starter, because the absence is a build
# file detail and this is a property of the module: its README says "public surface: none", and the day
# somebody adds a starter for an actuator they should meet this line.
spring.main.web-application-type=none

# --- Data access -----------------------------------------------------------------------------------
#
# Same shape as apps/api's, and for the same reasons (see platform/persistence): the application connects
# through PgBouncer, Flyway connects to Postgres directly because DDL cannot go through a transaction pooler,
# and Flyway's credentials are separate and must be given - setting spring.flyway.url stops it inheriting the
# DataSource's username and password.
#
# Two deployables run the same migrations against one schema. Flyway's own locking makes that safe, and it is
# deliberate: whichever starts first applies them, and neither owns the schema (RULE B17 - each migration
# lives beside the module that owns the table it creates).
spring.datasource.url=${REDUCTXN_DB_URL:jdbc:postgresql://localhost:6432/reductxn}
spring.datasource.username=${REDUCTXN_DB_USER:reductxn_app}
spring.datasource.password=${REDUCTXN_DB_PASSWORD:reductxn_local_only}

spring.flyway.url=${REDUCTXN_DB_DIRECT_URL:jdbc:postgresql://localhost:5432/reductxn}
spring.flyway.user=${REDUCTXN_DB_USER:reductxn_app}
spring.flyway.password=${REDUCTXN_DB_PASSWORD:reductxn_local_only}

# --- Tax -------------------------------------------------------------------------------------------
#
# Which jurisdiction's rules apply to a partition, per ADR 0006. Required with no default, exactly as in
# apps/api, and for the same reason: a deployment that has not been told its jurisdiction would resolve no
# rule, and no tax looks exactly like low tax. Here it is worse rather than better - a run that assessed no
# tax would settle a cycle for less than the group owes.
reductxn.tax.jurisdiction=${REDUCTXN_TAX_JURISDICTION}
