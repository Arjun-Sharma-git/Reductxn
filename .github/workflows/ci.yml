# The gates, run by something that is not the person who wrote the change.
#
# Until this file existed, every gate in MASTER-PLAN section 8 ran from `./gradlew clean build`, `pnpm check` and
# `pnpm e2e` on a developer's machine - which is the difference between a gate and a habit. The plan recorded that as
# a gap and ADR 0031 is the decision; the two defects the last slice found only on a fresh clone (a test that passed
# by luck, three browser tests that measured a cold start) are the argument.
#
# Two jobs rather than one, because the two halves share nothing but a checkout and a failure in either is useful
# immediately. Each is named after the command it runs, so a red badge in a branch list says what to type.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a pipeline can be run against a branch without pushing a commit to it.
  workflow_dispatch:

# A force-push makes the older runs of that branch pointless, and runner minutes are a real cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and no secrets: every gate here runs from a checkout and needs no credentials. A pipeline that could
# write to the repository would be a second way to change it, which this one has no reason to be.
permissions:
  contents: read

jobs:
  api:
    name: api - ./gradlew clean build
    runs-on: ubuntu-latest
    # A hung runner should fail rather than occupy the queue for an hour: the whole build is minutes on a normal day.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Temurin 25, matching the toolchain the build declares (`libs.versions.toml` and the conventions plugin) and
      # the distribution a developer here has. A different JDK would make "it passes locally" mean less than it does.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # One command, because that is what the plan's gate table says and because `build` already includes the checks
      # that protect rules: the P1 float scan, the architecture tests, the rule-coverage test and every module's
      # tests. `--no-daemon` because the daemon outlives nothing here.
      #
      # Docker is required and is present on this runner: the API's integration tests run against a real Postgres
      # through Testcontainers, deliberately - H2 would accept a dialect-adjacent version of the SQL and prove the
      # opposite of the thing under test.
      - name: Build and test every module, the rules' checks included
        run: ./gradlew clean build --no-daemon

  web:
    name: web - pnpm check and pnpm e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # `apps/web` is its own package-manager root (its `pnpm-workspace.yaml` is pnpm's settings file), which is
        # where the lockfile and every script live.
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in `package.json` rather than from a number written here, so the
      # pipeline and a developer cannot disagree about which pnpm runs the gates.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # `--frozen-lockfile`: the install is a gate too. A resolution that changes here but not in the commit is
      # exactly the drift the lockfile exists to prevent.
      - name: Install exactly the lockfile
        run: pnpm install --frozen-lockfile

      # RULE C3, and the row in the gate table that said "codegen diff check" with nothing behind it. The client's
      # types are generated from the contract and committed, so regenerating them and finding a difference means the
      # committed client is not the contract - the one failure that makes every other client test beside the point.
      - name: The generated client still matches the contract (RULE C3)
        run: |
          pnpm codegen
          git diff --exit-code -- src/shared/api/schema.d.ts

      # Types, lint, catalogs (I1, I2, I3, I7), the unit and component tests, and a build. One command for the same
      # reason as the API job: it is what a developer runs, so what passes here is what passes there.
      - name: Types, lint, catalogs, unit tests and a build
        run: pnpm check

      # The route tree is generated by the router plugin during the build and is committed. The build has just
      # regenerated it, so a difference from the commit means the committed tree is not what those routes produce -
      # a route added without a build, which is silent locally and breaks a checkout.
      - name: The committed route tree is what the routes generate
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Install the browser the suite drives
        run: pnpm exec playwright install --with-deps chromium

      # Playwright reads `CI` from the environment, which this runner sets: retries become 1, the reporter becomes
      # the one that annotates the commit, and the preview server is started for this run rather than reused - so the
      # suite exercises a cold start, which is where it last found a defect.
      - name: The browser suite
        run: pnpm e2e

      # Traces and screenshots are the only way to see what a browser test saw after the runner is gone, and they are
      # kept for failure only. The report is not a gate; it is what makes a failure actionable.
      - name: Keep the browser report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
