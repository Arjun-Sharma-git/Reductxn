# Single dependency version catalogue (RULE B9).
# Every dependency used anywhere in reductxn is declared here exactly once.

[versions]
# Toolchain constraints, established by actually running the build (see MASTER-PLAN Appendix B).
# They are pins with reasons, not preferences:
#   - Gradle >= 9.1 is required to RUN on Java 25. Gradle 8.14.x tops out at Java 24.
#     This project uses 9.7.1 via gradle/wrapper/gradle-wrapper.properties.
java = "25"
springBoot = "4.1.1"
springFramework = "7.0.9"
# The three below must agree with the Spring Boot line, because the Boot BOM manages them for every
# module that imports it and the BOM wins. A pin that disagrees is a pin that is silently ignored - which
# is what these were until platform/persistence finally depended on them: flyway was pinned at 11.0.0 and
# resolved to 12.4.0, jOOQ at 3.20.0 and resolved to 3.21.7, postgresql at 42.7.5 and resolved to 42.7.13.
# Nothing had ever used them, so nothing had ever disagreed out loud. Read from the BOM rather than guessed.
jooq = "3.21.7"
flyway = "12.4.0"
postgresql = "42.7.13"
testcontainers = "1.20.5"
# Must be >= 1.5.0. Earlier 1.x releases cannot read Java 25 bytecode (class file major version 69):
# they import zero classes, and every architecture rule then fails as "emptyShould" - or, if
# failOnEmptyShould is ever disabled, passes silently while enforcing nothing at all.
archunit = "1.5.0"
jqwik = "1.9.3"
assertj = "3.27.0"
mockito = "5.15.2"
resilience4j = "2.3.0"
micrometer = "1.15.0"
otel = "2.16.0"
caffeine = "3.2.0"
kafka = "3.9.0"
timefold = "1.26.0"

# --- LTS track note: keep this aligned with the Spring Boot line we target (ADR 0002) ---

junit = "6.0.3"
junitPlatform = "6.0.3"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
# The plain starter, for a deployable with no HTTP surface: workers/settlement has none (its README says
# "public surface: none"), and pulling starter-web in to get a context would give it a server it must then
# be trusted not to grow endpoints on.
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# The jOOQ library without the starter, for the architecture tests: B16 forbids jOOQ types outside the
# persistence adapters, and a rule can only police a type it can see.
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
# Jackson's databind, for a deployable with no web starter that still has to read a `jsonb` column - the tax
# rule's parameters. `tools.jackson` is Jackson 3, which is the line the Spring Boot BOM we target manages
# (ADR 0002); the version is deliberately left to it, as with the starters.
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
# Boot's Jackson autoconfiguration, which is its own module in Boot 4 rather than part of spring-boot-autoconfigure
# - the same modularisation that puts Flyway's per-database support in a separate artifact. A deployable without a
# web starter needs it named to get a configured ObjectMapper bean.
spring-boot-jackson = { module = "org.springframework.boot:spring-boot-jackson" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# The Spring Framework libraries a module needs without a starter. `spring-tx` carries @Transactional -
# the library, not the starter, because a starter would pull a DataSource in, and RULE B15 needs the
# annotation long before it needs the machinery. `spring-context` is here so the architecture tests can
# name MessageSource in order to forbid it: a rule can only police types it can see.
#
# Pinned to `springFramework` rather than left to the Boot BOM, because platform/testing does not import
# the BOM and a versionless dependency there would not resolve at all.
spring-tx = { module = "org.springframework:spring-tx", version.ref = "springFramework" }
spring-context = { module = "org.springframework:spring-context", version.ref = "springFramework" }
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "kafka" }
timefold-solver = { module = "ai.timefold.solver:timefold-solver-core", version.ref = "timefold" }

# --- Testing ---
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
