openapi: 3.1.0

info:
  title: reductxn API
  version: 1.0.0
  description: |
    Non-custodial group commitment ledger with tax-optimised CBDC settlement.

    This file is the SOURCE OF TRUTH (RULE C1). Do not edit generated clients.
    All amounts are integer minor units. There are no floating-point amounts anywhere.

    FX rates are also scaled integers, never floats (P12, ADR 0013).

    Locale policy: this API returns NO localized prose and accepts no locale parameter. Errors carry
    a stable `code` plus structured `params`, and the client localizes from its own ICU catalog
    (RULE B20, ADR 0014). Timestamps are ISO 8601 with an explicit offset, and instants that depend on
    a group's calendar are resolved in that group's `settlementTimezone`.

servers:
  - url: https://api.reductxn.example/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
  - name: groups
  - name: obligations
  - name: netting
  - name: settlement
  - name: tax
  - name: fx
  - name: reference
  - name: webhooks

paths:
  /auth/otp/request:
    post:
      tags: [auth]
      summary: Request an OTP for a phone number
      security: []
      description: |
        Send a code that proves the caller's phone number. This is the whole of sign-in: there is no password, so there is
        nothing to leak and no reset to get wrong.

        **The response does not contain the code, and that is deliberate.** A code in a response is a code anybody reading
        the response has, which is the same as no code at all - so it goes to the phone, and a deployment answers `202`
        whether or not the number is one it has seen before. Not distinguishing those two is what stops this operation
        from being a way to ask which numbers have accounts.

        **The values a caller cannot choose.** A code lives five minutes, and one number may ask for three in ten - the
        second is the `429`, and it exists because an endpoint that sends a message on every request is a way to spend
        somebody else's money. Neither is configurable here, for the reason the invite window is not: a window a
        deployment can change is one whose behaviour nobody can reproduce from the code.

        **The stand-in, stated where a client will read it.** This deployment has no SMS provider and no email, so the
        code is written to the server log by the delivery adapter - a working answer for a single-machine deployment and a
        hole anywhere else. The port exists so that replacing it is one class, and the ADR records the gap rather than
        this document pretending otherwise (ADR 0042).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber: { type: string }
      responses:
        '202': { description: Accepted }
        '400': { $ref: '#/components/responses/Problem' }
        '429':
          description: Too many codes asked for in the last few minutes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an OTP and receive tokens
      security: []
      description: |
        Hand the code back and receive a session: an access token for authenticated reads and a refresh token that renews
        the pair.

        **Verifying a code is registering a person.** A number nobody has seen before becomes a user here, because in an
        OTP build the code *is* the registration - there is no separate sign-up, and no admin would be needed to seed one.
        What this deployment calls them is the number itself, until a group records its own name for them
        (`group_members.display_name`).

        **Every failure answers one code.** A number that never asked, a code that is wrong, one that has expired and one
        that has been spent are all `api.otp_not_accepted`, because telling a caller which of them it was tells somebody
        guessing whether there is a live challenge to guess at. A wrong code does spend an attempt, and a challenge dies
        after five, which is what makes that one answer affordable.

        **`deviceId` is a label, not a credential.** It is client-supplied and unverified, like a decision's `memberId`;
        it is recorded on the session so "where am I signed in" has an answer.

        **The tokens are opaque.** `bearerFormat` no longer says JWT: a JWT would need a signing key and a rotation story
        for that key, and `POST /auth/refresh` needs a row to rotate either way, so a stateless token would buy one
        indexed lookup at the cost of a key management problem (ADR 0042).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code, deviceId]
              properties:
                phoneNumber: { type: string }
                code: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      security: []
      description: |
        Replace both tokens, given the refresh token.

        **The body is an addition this contract needed.** The operation declares `security: []` - the OpenAPI way of
        saying "the bearer token does not authenticate this" - and it declared no request body, so there was nowhere for
        the refresh token to travel. Reading the `Authorization` header as an access token on some paths and a refresh
        token on others was the alternative, and it would make one header mean two things depending on the URL (ADR 0042).

        **Both tokens are replaced, always.** Keeping the refresh token while renewing the access half would leave a
        credential valid for the rest of its life, which is the opposite of what rotating one is for - so a replay of the
        previous refresh token is a `401`, and two rotations racing on one token produce one pair rather than two.

        **A rotation does not extend the session.** The refresh window is carried over untouched, so a client that
        refreshes for twenty-nine days is signed out on the thirtieth. That is what a session length means; the
        alternative is a session that never ends as long as somebody keeps using it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [me]
      summary: Current user profile and KYC tier
      description: |
        Who is asking, according to the bearer token in the request.

        **This is the read the client has been working around since its first screen.** Without it there is no way to know
        which member a person is, so every screen that names somebody fell back to showing a uuid - and the missing members
        read looked deliberate rather than missing for seven slices (ADR 0035, 0038).

        **No credential is a `401`, and so is a token nobody issued.** From the outside those are the same request, and
        telling them apart would tell a caller whether a token was ever real. The refusal's `code` says one thing -
        `api.not_signed_in` - for an unknown token, an expired one and one that has been rotated away.

        **`kycTier` is `none` for everybody in this deployment.** There is no KYC provider, so no tier has been
        established; the schema requires the field and the value means "not established", not "established as nothing". A
        stored tier nobody ever checked would read as a decision somebody made.

        **The global `bearerAuth` finally means what it says.** Every operation in this document is declared `bearerAuth`
        at the top and the auth operations opt out; this is the first operation that reads the token. What it deliberately
        does not do is enforce the declaration on the other boundaries - requiring tokens everywhere would break every
        existing caller at once, and doing that is the next slice rather than something to smuggle in behind the first
        token (ADR 0042).
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }

  /groups:
    get:
      tags: [groups]
      summary: List groups the caller belongs to
      description: |
        The groups this person is a member of, most recently joined first.

        **This operation cannot be answered without a caller**, and it is the first one in this document that says so. "The
        groups you belong to" is a question about a person; the alternative was a query parameter naming one, which is the
        shape every earlier boundary in this build takes - a decision's `memberId`, an obligation's `debtorId`, an
        invitation's `userId` are all "whoever the request says". A new operation has no callers to break, so it takes the
        caller from the token instead (ADR 0043), and a request with no usable session is a `401`.

        **The order is the memberships'.** A group somebody just created is the first thing they see. Name order would put a
        group they have not opened in months above the one they are using, which is why it is not the order.

        **An empty array is the honest answer for somebody in no group**, not a refusal: a person who has just signed in
        belongs to nothing, and a client that showed an error for that would be shouting at the ordinary first page.

        `memberCount` is counted from the memberships on every read, so it cannot drift from the rows that are the fact.
      responses:
        '200':
          description: Groups, most recently joined first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [groups]
      summary: Create a group
      description: |
        Create a group, which makes its creator a member.

        **The caller comes from the token, and the body has no field for one.** Every earlier write in this document takes
        the person from the body, because identity did not exist when they were written; this operation has a token to read
        and no callers to break, so it does not accept a uuid for the caller at all (ADR 0043).

        **Creating a group makes its creator an `admin` member, in the same transaction.** Not a flourish: `GET /groups`
        answers with the groups somebody belongs to, so a group whose creator was not a member would be invisible to the only
        person who could have asked for it. The role is recorded and not enforced, like every role in this build.

        **Idempotent on this creator and this key.** The key is a required header and there is no group in the path to scope
        it by, so the pair is the scope: a retry answers `200` with the group the first attempt created, and a first attempt
        answers `201`. The same status pair the obligation, member and invitation writes use (P8) - a retry is not an error,
        and a client told `201` twice for one group would believe two exist.

        **Everything a request can name is resolved or refused, never stored on trust.** A currency becomes an exponent
        through this deployment's own catalogue, so a currency it does not hold is a `422 api.obligation_unknown_currency` -
        the same code the recording path answers, because it is the same condition (ADR 0037). `settlementTimezone` is parsed
        as an IANA zone: `"IST"` is an abbreviation three countries share and is refused, because a zone no calendar can
        resolve is worse than no zone at all. A name longer than the schema's own `maxLength` is a `400`.

        **Three things this response does not promise, stated rather than implied.** `maxMembers` is stored and nothing
        consults it yet, exactly as a member's `role` is recorded and unread. `settlementTimezone` is omitted when the request
        did not name one - the schema makes it optional and a default would decide which cycle an obligation falls in for a
        household somewhere else (ADR 0014, point 6). And there is no `nettingPolicy`: the field exists in the schema and the
        sentence it would carry summarises a configuration this build does not have.

        **This operation used to declare `409 Group already exists`, and it no longer does.** That line was a promise with no
        condition behind it: a group's name is not unique - two households really can be called "Flat 3B" - and the only
        "already" this build can decide is a replayed idempotency key, which is answered `200` with the record rather than as
        a conflict (ADR 0043).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency]
              properties:
                name: { type: string, maxLength: 120 }
                currency: { $ref: '#/components/schemas/Currency' }
                reportingCurrency:
                  allOf: [{ $ref: '#/components/schemas/Currency' }]
                  description: |
                    Currency used for headline totals spanning several currencies. Defaults to
                    `currency`. Purely presentational and restatable (ADR 0013, point 5).
                settlementTimezone:
                  type: string
                  description: |
                    IANA zone, for example Asia/Tokyo. Anchors the cycle boundary and tax
                    effective dates so all members agree which cycle an obligation belongs to
                    (ADR 0014, point 6). Forward-only if changed.
                  example: Asia/Kolkata
                maxMembers: { type: integer, default: 200, maximum: 200 }
      responses:
        '200':
          description: The group this key already created - a retry, answered with the record rather than a second group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      summary: Group detail
      description: |
        One group's own screen: its name, what it settles in, and how many members it has.

        **Membership is the read's condition, not a check after it**, so a group the caller is not in is answered exactly as
        a group that does not exist - one code, `api.no_such_group`, one `404`. The sameness is deliberate: telling the two
        apart would let anybody holding a guess learn which ids are real, which is the same reasoning that makes an unknown
        phone number and a wrong code one answer on the sign-in path (ADR 0042). An id that is not a uuid is a `400`
        instead, because a typo is not a permission question.

        **This is the read the group's own screens wanted, and it is not a precondition for the other group reads.** Those
        serve every group id in this database, including ids with commitments and no group row - the state this build's
        development data is in, and the reason `groups` arrived as an additive table rather than a foreign key everything
        else had to satisfy (ADR 0043).
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      summary: The group's members, in the order they joined
      description: |
        Who can be named - a debtor, a creditor, a filter, a participant in a preview - and the name to show them
        by. **This read exists because three screens have been asking for it and the API never answered.** The
        client's member catalogue has called this path since obligations were built, so in development every
        screen that names a person fell back to showing a uuid, and no test could see it: the client's tests stub
        the API, and this module had never asked for members - the endpoint was a promise in the contract with
        nothing behind it (ADR 0035).

        Membership is data rather than a consequence of a group's activity: a member who has promised nothing yet
        is still a member, and an obligation naming somebody outside the group is refused by the write that
        records the obligation rather than by this read.

        The order is the index's - `group_members_by_group (group_id, joined_at, user_id)` - so a page is the group
        in the order people joined, and the tie-break on the id makes that total rather than arbitrary.

        `displayName` is what the group recorded, not a directory lookup: there is no `users` table in this build,
        so a name is a fact the group agreed on. `role` is recorded and nothing consults it yet, which the schema
        says rather than hides.

        **Membership is the condition, since ADR 0054** - a group the caller is not in is a `404` with the same code
        and the same reasoning as the group read (ADR 0043): telling "no such group" and "not yours" apart would let
        anybody holding a guess learn which ids are real. This read served a bare uuid until then, and the paragraph
        that used to be here said so: "groups are not tables, so the empty array is true of a group with no members
        and of a group that does not exist". The second half of that was true when it was written and has been false
        since ADR 0043 gave groups a table - and a read that answers an empty list for a group it will not name is a
        read that cannot be told apart from a working one.
      responses:
        '200':
          description: Members, in the order they joined
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a group's books are read by its members (ADR 0054). The 404 is one answer
        # for "no such group" and "not yours", so a guessed id cannot be tested by comparing two refusals.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [groups]
      summary: Record a member of the group
      description: |
        Writes one row of `group_members`: who the member is, what the group calls them, and whether the group
        calls them an admin.

        **A member of the group may add somebody, and that is the rule rather than `admin only`** (ADR 0048). This
        paragraph used to say the endpoint was unauthorised: there was no identity, so no `admin` row could authorise
        anything, and the summary admitted that rather than promising a check it could not make. Identity exists now, so
        the caller is resolved and must be in the group - and the check is *membership* rather than the role, because the
        role is recorded and nothing reads it yet: an admin-only rule here would invent a privilege whose only effect
        would be to make this operation unusable for everybody the invitation flow creates, which is every member but
        the group's creator (ADR 0043). A caller who is not in the group gets the `404` below, which is one answer for
        "no such group" and "not yours", so a guessed id cannot be tested by comparing two refusals.

        **Idempotent by rule rather than by a key.** `(groupId, userId)` is unique, so a second request for the
        same member answers `200` with the member that exists instead of recording a second one, and a retry whose
        response was lost collides with the first attempt's row (P8). Nothing is overwritten either: a name the
        group has recorded is not changed by a later request, which is why this is an add rather than an upsert -
        and why renaming belongs to the admin operation this build does not have.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberRequest' }
      responses:
        '201':
          description: Member recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '200':
          description: The member was already recorded, and is returned as it stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both of these arrived with the rule that a member is who may add somebody (ADR 0048). The 404 is one answer for
        # "no such group" and "not yours", so a guessed id cannot be tested by comparing two refusals.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/invites:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      summary: Create an invite code
      description: |
        A code that lets somebody join this group, which is the only way anybody gets one.

        **What the caller cannot choose, and why that is not a gap.** This operation has no request body, so there is
        nowhere to ask for a shorter window or a one-time code - which makes both a decision of this deployment rather
        than a default a caller could have overridden. A code lasts **seven days** and has **no use limit**: an
        invitation is a link a group shares with somebody it trusts, and what stops it is time rather than a count. A
        group that wants a one-time code needs an operation to ask for one; when that exists, this description and the
        `maxUses` field it leaves absent are where it will show.

        **The code is short enough to read out loud and cannot be guessed.** Eight characters from a thirty-two-symbol
        alphabet (forty bits), excluding `0`, `1`, `I` and `O` because a code is transcribed by a person. It is unique
        across the deployment rather than within the group, and the next operation's shape is why: acceptance is
        addressed by the code alone, so the code has to say which group it is for.

        **A member of the group may create one, because the group is what an invitation is for** (ADR 0048). This
        paragraph used to be the recorded identity gap said out loud - "anyone can create an invitation, and that is the
        recorded identity gap rather than a policy" - and the policy it left open is now decided: a code is a link a group
        hands to somebody it trusts, so the caller must be in the group. One who is not gets the `404` below, which is one
        answer for "no such group" and "not yours", so a guessed id cannot be tested by comparing two refusals.
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '400': { $ref: '#/components/responses/Problem' }
        # A member of the group is who may create one, which is the policy this operation's description used to leave
        # open (ADR 0048). The 404 is one answer for "no such group" and "not yours".
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /invites/{code}/accept:
    post:
      tags: [groups]
      summary: Accept an invite and join the group
      description: |
        Somebody hands in a code and joins the group it is for.

        **The joiner is the caller, and the body no longer says who.** This description used to promise exactly this:
        "when sign-in exists, this body disappears and the acceptance becomes about the caller". Sign-in exists (ADR
        0042), so the promise is kept rather than left standing - the `userId` field is gone from the request, and the
        membership is recorded for whoever holds the session. A code is a thing somebody is *given*, and handing one in
        joins *you*: an operation that let a caller name the joiner would let them spend an invitation on somebody
        else's behalf, which is the one thing an invitation is not for (ADR 0041).

        **Accepting joins as an ordinary `member`.** The invitation carries no role, and a code that conferred `admin`
        would be a privilege handed out by a default rather than decided by somebody.

        **A code for a group you are already in is a success, not a conflict.** Membership is idempotent - a second
        record for the same person in the same group changes nothing - so the answer is the member as they stand, and
        the invitation is **not** spent: a use is spent by joining, and nobody joined. That is the case this operation
        exists for as much as the first joining is, and answering it with an error would make the most benign request
        look like a mistake.

        **The code is read in the case it was typed.** The alphabet is uppercase and the store refuses anything else,
        so a code typed in lowercase is trimmed and uppercased at the boundary rather than answered with a `404` whose
        cause would be invisible in the request.

        **A code that ran out is `410`, and a code that never existed is `404`.** The two are distinguished because
        they are different questions: a mistyped code is a code for nothing, while an expired or exhausted invitation
        existed and is finished. The `code` field of the problem body says which of the two it was, so a client can say
        "that one has been used" rather than "that code is wrong".
      parameters:
        - name: code
          in: path
          required: true
          description: The invitation's code, as it was created.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvite' }
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '200':
          description: Already a member of the group, so nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Problem' }
        # The joiner is the caller now, so a request with no session is refused like every other boundary that needs one
        # (ADR 0047). It is listed here rather than only declared globally because a client generating from this document
        # can see every answer this operation gives.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /invites/{code}:
    get:
      tags: [groups]
      summary: What an invite code is for, before accepting it
      description: |
        The group a code joins somebody to, and whether the code still works.

        **This is the read that makes the code the thing a group shares** (ADR 0054). Until it existed, a code could
        only be *spent*: the acceptance answered with the membership it created, so the person following a link had to
        type their name into an operation that named no group, and a group with something to share had nothing to send
        but an id. A code was already the only credential this product hands out - eight characters from a
        thirty-two-symbol alphabet, with a window and optionally a use limit - so what was missing was not a
        mechanism but a *screen's worth of facts*: which group, how many people are in it, and whether the invitation
        has run out.

        **No session, and that is the operation rather than an omission.** This is the one read in the document with
        `security: []`, and the reason is who asks it: a person who followed a link and has not signed in yet. The
        code *is* the capability - it is unguessable, it expires, and the group chose to hand it out - so a preview
        readable by whoever holds the code is exactly as private as the link itself. What that buys is the flow the
        acceptance cannot provide: somebody can see what they are being asked to join, and decide, before creating a
        session. Everything a *member* can read is still behind membership (ADR 0044, 0054), and this operation reads
        nothing beyond the group's name and its member count.

        **What is deliberately not here.** No amounts, no member names, no commitments, no activity: a code says "you
        are invited to this group", and an invitation that disclosed the group's ledger before somebody joined would
        be a disclosure the group did not make. `memberCount` is the one number, because "which group is this" is
        unanswerable when three groups are called `Flat 3B` - and because the group's own list screen shows its
        members that number already.

        **`group.name` is absent for a group that exists only as rows.** `group_members` and `invitations` write a
        bare uuid, and a group with members and commitments and no `groups` row of its own is a state this build
        contains (ADR 0043, which added the table rather than migrating the data). Its invitations are real, so they
        preview: the `id` is always present and the `name` is the field that may be missing, which is what the client
        shows - the same fallback its group layout makes for the same reason.

        **Nothing about who created the code.** `invitations` has no creator column, deliberately (ADR 0041), so the
        "who invited you" a joiner might expect is not a fact this deployment holds - and this document says so rather
        than leaving a client to wonder why the field is missing.
      parameters:
        - name: code
          in: path
          required: true
          description: The invitation's code, as it was created.
          schema: { type: string }
      responses:
        '200':
          description: The invitation, and the group it joins somebody to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        # A code that never existed, and a code whose window has closed or whose uses are spent. The two codes under
        # the 410 are the same pair the acceptance answers with, for the same reason (ADR 0041): a reader is told
        # which of the two ran out, because "ask for a new code" and "that one has been used" are different sentences.
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/balances:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [netting]
      summary: Current net position per member over open obligations
      description: |
        What each member owes or is owed right now, one entry per member **per currency**.

        **This is the preview's own computation, as of now.** It is the same read the netting preview performs
        (ADR 0039): the group's open obligations at this instant, partitioned by currency, netted per partition, and
        flattened into positions. That is deliberate rather than convenient - a group that previews one thing and
        reads another has been told two things, and a second composition path is how the two answers start to
        differ. The consequence is honest and worth stating: this read needs the tax rules the plan needs, because
        the netting engine assesses tax on the transfers it emits, so a group with no rule in force for a currency
        it holds is told that here rather than being shown a number whose arithmetic nobody can reproduce.

        **No `asOf`, unlike the preview.** A balance is the question "what do we owe each other now", and a member
        who wants a past instant is asking for a what-if - which is what the preview's `asOf` is for. Two ways to
        ask one question, with the same set of obligations, would be two answers.

        **A member in two currencies appears twice**, once per currency, because ADR 0012 refuses a cross-currency
        total: every entry carries its own currency and nothing is summed. `direction` is `pay`, `receive` or
        `flat`, and `flat` is included - a member who owes and is owed the same is a member, and a row that
        vanished would look like a member who left.

        **The clearing account can appear as a position.** A cross-currency obligation is booked through
        `fx_clearing`, so a group that has crossed currencies has a position whose `userId` is that account rather
        than a member - it is the group's own external requirement, not a person. The schema carries no way to tell
        the two apart yet, which is recorded as a gap rather than papered over: a client shows the identifier for it,
        the same way it shows one for a member it has no name for.

        **Membership is the condition, since ADR 0054** - a group the caller is not in is a `404` with the same code
        and the same reasoning as the group read (ADR 0043): telling "no such group" and "not yours" apart would let
        anybody holding a guess learn which ids are real. Balances are the most sensitive read in this document -
        every member, every amount, and who owes whom - so this endpoint holding a bare uuid was the widest of the
        nine reads ADR 0054 closed, and it was reachable from the client by pasting an id.
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetPosition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/activity:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      summary: Group activity feed
      description: |
        What has happened in this group, newest first.

        **This operation was the least specified thing in this document, and this is where its shape is decided.** It had a
        summary, a `cursor`, a `limit`, and a `200` whose entire description was "Activity page" - no schema, no failure, no
        description. It is specified here rather than left as a promise, because a client that has to guess a shape is a
        client that will guess differently from the next one (ADR 0044).

        **`cursor` is deleted and `limit` stays.** The document promised a cursor and no limit, which is a promise to answer
        with every event a group has ever produced; the obligations read already made this decision for the same reason - a
        page is what a screen can render, the clamp is the one the runs, cycles and obligations reads apply, and a cursor
        arrives with the pagination this build still owes.

        **There is no activity table, and there is not going to be one.** The feed is derived from the rows that already
        record an act: a membership (somebody joined), a settlement decision (somebody answered a run), and an invitation (a
        code was created). An `activity` table would be a second copy of facts those rows state, and the first write that
        updated one and not the other would make the two disagree - with the log being the copy nobody can check.

        **Three kinds, and what is not here is a decision.** Obligations, cycles and runs are not in this feed: each has its
        own read and its own screen, and a feed that repeated them would be a second view of one set of rows that could
        disagree with the first about ordering, filters and status. What a member wants here is the *social* history of the
        group - who joined, who answered, what was asked.

        **Two things this feed cannot say, and it does not pretend to.** Who created an invitation: `invitations` records
        the code and its window and has no creator column, because the create operation is unauthenticated in this build and
        there is nobody to name (ADR 0041). And who accepted one: acceptance increments a use count and writes a membership,
        so the feed reports the membership that resulted and does not report the acceptance. Both are the rows' own limits
        rather than this read's choices, and a client that showed "Amit invited Rehana" would be inventing a fact.

        **Membership is the condition** - a group the caller is not in is a `404` with the same code and the same reasoning
        as the group read (ADR 0043): telling "no such group" and "not yours" apart would let anybody holding a guess learn
        which ids are real.
      parameters:
        - name: limit
          in: query
          description: How many events to answer with. Clamped to 200, the bound every paged read here applies.
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Activity, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityEvent' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /obligations:
    get:
      tags: [obligations]
      summary: List obligations, filterable by group, member, status and date
      description: |
        A group's commitments, newest first unless `sort` says otherwise, narrowed by the parameters below.

        **This read exists because the client has always called it and the API never answered** (ADR 0035, ADR 0036).
        The obligations screen is the one the whole interface is organised around, it has had its filters in the URL
        since it was built, and until now the only way to see an obligation this API had recorded was to record one
        and read the response.

        **`status` is derived, and derived once.** An obligation is `voided` when this module's `voided_at` is set,
        `settled` when a settlement run that ended in `done` has taken it, `netted` when a run that has not yet ended
        holds it, and `open` otherwise. The run's states are the settlement worker's own vocabulary, and a run that
        ended without settling (`rejected`, `failed`) *releases* its commitments rather than holding them - which is
        the same reading the netting preview uses, because a group that previews one thing and reads another has been
        told two things. The filter is applied to the same expression the response carries, so a page cannot contain
        a row whose status it would not display.

        **The dates are UTC days.** `from` is that day's midnight UTC and `to` is inclusive of the whole of its day,
        which is a stand-in of a real kind: the day belongs to the group, and a group's `settlementTimezone` is
        nullable, so a group that has not chosen one has no day to evaluate a bound in (ADR 0043). This paragraph used
        to say that no group exists in this build, which was true when it was written and false from the moment groups
        became a table.

        **`memberId` means either side.** A member reading their own ledger wants what they owe and what they are
        owed, which is why the parameter is not called `debtorId`.

        **Membership is the condition, since ADR 0054** - a group the caller is not in is a `404` with the same code
        and the same reasoning as the group read (ADR 0043): telling "no such group" and "not yours" apart would let
        anybody holding a guess learn which ids are real. The obligations list is the screen this interface is
        organised around, and it names both parties of every commitment, so until then a group's whole ledger was
        readable by anybody who had its id.

        **`cursor` is gone and `limit` is here.** The document promised a cursor and no limit, which is a promise to
        answer with every obligation a group has ever recorded; a page is what a screen can render, the clamp is the
        one the runs and cycles reads apply, and a cursor arrives with the pagination this build still owes
        (recorded in the plan).
      parameters:
        - name: groupId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: |
            Derived rather than stored: see the description above for where each word comes from.
          schema:
            type: string
            enum: [open, netted, settled, voided]
        - name: memberId
          in: query
          description: An obligation on either side of this member - what they owe or what they are owed.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Inclusive, as a UTC day.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive of the whole day, as a UTC day.
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: |
            `-occurredAt` for newest first (the default) or `occurredAt` for oldest first. A second field to sort by
            arrives with the index that makes it cheap; a word neither of these is refused rather than ignored.
          schema: { type: string, enum: ['-occurredAt', 'occurredAt'], default: '-occurredAt' }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Obligations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Obligation' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a group's books are read by its members (ADR 0054). The 404 is one answer for
        # "no such group" and "not yours", so a guessed id cannot be tested by comparing two refusals.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [obligations]
      summary: Record an obligation (a commitment, not a money movement)
      description: |
        Records what one member owes another, and books what that does to the group's ledger.

        **A member of the group may record one, and the recording is attributed to them** (ADR 0049). A caller who is not
        in the group named in the body gets the `404` below, which is one answer for "no such group" and "not yours", so a
        guessed id cannot be tested by comparing refusals - the same reading this operation's own `void` has used since
        ADR 0045. The `debtorId` and `creditorId` are the two *parties* and are not the caller: a member records a
        commitment between any two members of their group, including two other people.

        **Attribution is part of the entry, not a column beside it.** The member who recorded the commitment travels to
        the ledger as the journal entry's `createdBy`, which the entry's hash covers (L4) - so what the chain commits to
        includes who caused it, and an offline verifier recomputing the chain from its own rows gets the same answer. That
        field was `null` for every recorded obligation until this slice, with a comment saying no identity module existed;
        it has existed since ADR 0042.

        **Idempotent on `Idempotency-Key`**, per the header's own description: a replay answers with the obligation the
        first attempt recorded and writes nothing - not even a second attempt at attribution, because the key identifies
        an obligation rather than a request.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, debtorId, creditorId, amount, memo]
              properties:
                groupId: { type: string, format: uuid }
                debtorId: { type: string, format: uuid }
                creditorId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/Money' }
                settleInCurrency:
                  allOf: [{ $ref: '#/components/schemas/Currency' }]
                  description: |
                    Optional. When different from `amount.currency`, the server locks an FX quote and
                    the request fails closed if no fresh rate is available.

                    Two failures are possible and they are not the same failure. `fx.rate_stale` (422)
                    means a rate was found and was not usable at the moment of locking, so this request
                    cannot be honoured. `fx.rate_unavailable` (503) means no rate could be obtained at
                    all, so the server cannot answer yet and the client should retry later. A pair with
                    nothing quoted at or before the obligation's instant is answered the second, which is
                    what "no rate means no cross-currency" means in practice.
                memo: { type: string, maxLength: 280 }
                occurredAt: { type: string, format: date-time }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Obligation' }
        '422': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a member is who may record into a group (ADR 0049). The 404 is one answer for
        # "no such group" and "not yours", so a guessed id cannot be tested by comparing refusals.
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { description: Group ingestion rate limit exceeded }
        '503':
          description: |
            The server cannot answer yet, and the request should be retried. Today this is
            `fx.rate_unavailable` for a cross-currency obligation whose pair has no rate quoted at or
            before the obligation's instant. Distinct from a 422 on purpose: a 422 means the request is
            answerable and the answer is no, and a client that treated the two alike would either give
            up on a request that would succeed later or retry one that never will.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /obligations/{obligationId}/void:
    post:
      tags: [obligations]
      summary: Void an obligation (compensating entry, never a delete)
      description: |
        Records that a commitment should never have been written. The row stays and keeps its instant; `voided_at` is set and
        the derived status becomes `voided` (ADR 0004, 0036). A delete would erase the fact that a member recorded it, and a
        group that cannot see its own mistakes cannot audit them.

        **The response is the obligation, and the contract's `200` had no body at all.** "Voided" is not something a client can
        act on: the screen showing the row needs its new status, and the shape it already renders is this one, so answering
        with a different one would make the void path the only place a client parses a second shape. `occurredAt` stays the
        instant the commitment was incurred - when it was voided is not in this schema, deliberately: this is the commitment,
        and an audit trail is the activity feed's business rather than a field bolted onto the row a member reads.

        **The `Idempotency-Key` header is deleted, and the row's own state is why.** A key would create a second record of the
        same act - an idempotency row - while `voided_at` already answers "has this been voided". Voiding an already-voided
        obligation is a `200` with the row, not a `409`: the caller asked for a state the obligation is in, which is
        idempotence by state rather than by key (the same reasoning as `POST /groups` answering a replay with its record,
        ADR 0043).

        **`409` is kept, and this is the one place in the document where it means something.** An obligation a settlement run
        holds (`netted`) or has taken (`settled`) cannot be voided: the run's plan is built on it, and a commitment that
        disappeared from underneath a plan is what the run's lock exists to prevent. That is a conflict with the world rather
        than a malformed request, which is exactly what `409` is for - and the remedy is named in the body: open a cycle that
        releases it, or correct it in a later one.

        **Membership is the condition, and this is the first write that says so.** The caller comes from the token
        (ADR 0043), and they must be a member of the obligation's group. A group they are not in answers `404` with the same
        code as an obligation that does not exist, for the reason the reads give: telling the two apart would let anybody
        holding a guess learn which ids are real. The check needs the row to know the group, so unlike the activity read the
        order is read-then-check - and the refusal is still the same code, so nothing leaks by ordering.
      parameters:
        - name: obligationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Voided, or already voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Obligation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/netting/preview:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [netting]
      summary: What-if netting over currently open obligations
      description: |
        What this group's open commitments would settle as, if they settled at an instant, and what netting saves
        against paying every pair directly.

        **This operation was the only one in the document with no description at all**, and the reason is worth
        recording rather than quietly fixing: it was written in the first slice of the client (ADR 0028), when the plan
        over a group's obligations was the whole product and a summary and a `200` looked like enough. Everything the
        other reads now say about themselves - which obligations are in it, what a partition is, what the saving is
        measured against - is in `netting.md` and reaches a client through the response schema, so the sentence this
        paragraph adds is the one a reader of *this document* could not have guessed: **what it means for the answer
        to be a group's**, which is a question about who may ask.

        **Membership is the condition, since ADR 0054.** A group the caller is not in is a `404` with the same code and
        the same reasoning as the group read (ADR 0043): telling "no such group" and "not yours" apart would let
        anybody holding a guess learn which ids are real. A preview is the plan a group is about to execute, with every
        party and amount in it, so this is not a read that could be public.
      parameters:
        - name: asOf
          in: query
          schema: { type: string, format: date-time }
          description: |
            The instant to plan as of. Optional, and absent means now - the one place in this document where "now" is
            the default, because a preview of a past instant is the same computation with a different cut-off rather
            than a different operation.
      responses:
        '200':
          description: Preview result, including the tax saving versus pairwise settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NettingPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        # A group the caller is not in is a 404, and it is one answer for "no such group" and "not yours" (ADR 0054).
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/cycles:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [settlement]
      summary: Open a settlement cycle as of an instant
      description: |
        Closes a group's books at an instant: everything recorded at or before `asOf` - and not already
        settled by an earlier run - is what this cycle will settle. The instant **is** the cycle: it
        keys it, it is what the worker resolves every rate and tax rule at, and it is the one thing a
        settlement policy decides (ADR 0032).

        The instant is required, and that is deliberate. Defaulting it to "now" would make two requests
        a microsecond apart two different cycles - a double click would settle a group twice, and a retry
        after a timeout would open a second cycle rather than finding the first. With the instant
        supplied, opening is idempotent on `(group, asOf)`: a second request for the same pair answers
        `200` with the cycle that already exists, which is what makes the operation safe to repeat.

        **Nothing is computed here, and nothing is refused here.** A plan over the cycle is
        `workers/settlement`'s work, and its cadence computes an opened cycle within a minute - so a
        cycle may legitimately be opened for an instant with nothing recorded at or before it yet,
        because a commitment recorded today can carry an instant inside it (a backdated bill). A
        `422` for "nothing to settle" would therefore refuse a request the worker would compute a minute
        later, which is why there is not one: the refusal belongs to the worker, when it computes.

        What a client sees after this is a cycle to wait on, and the group's runs
        (`GET /groups/{groupId}/runs`) once it is computed. **A member of the group may open one, and since ADR 0049 a
        caller who is not gets the `404` below** - one answer for "no such group" and "not yours", so a guessed id
        cannot be tested by comparing two refusals. This paragraph used to say the opposite, in as many words: "There is
        no `404` for a group nobody has heard of: groups are not tables in this build, so 'no such group' cannot be told
        apart from a group whose books are empty". That was true when it was written and false since ADR 0043 gave groups
        a table and a creator - and a description that disagrees with the code is worse than no description, which is
        what RULE B20 means by a code being contract surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asOf]
              properties:
                asOf:
                  type: string
                  format: date-time
                  description: |
                    The instant the cycle is cut off at, and the instant every rate and tax rule is
                    resolved at. ISO-8601 with an offset or `Z`.
                  example: '2026-09-30T23:59:59Z'
      responses:
        '201':
          description: Cycle opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementCycle' }
        '200':
          description: |
            The cycle was already open for this group and instant, and this is it. Not an error, and not
            a second cycle: opening is idempotent so that a retry after a timeout finds what the first
            request made.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementCycle' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a member is who may close a group's books (ADR 0049).
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [settlement]
      summary: The group's settlement cycles, newest first
      description: |
        What a group has closed its books at, and what became of each one. **This is the read that makes an
        opened cycle visible.** Opening one writes a claim about an instant; whether a plan exists for it is a
        question about a *run*, and the worker answers it a minute later on its cadence. Without this read, a
        member who asked for a settlement and a member whose cycle the worker refused to plan (because the group
        has nothing recorded at or before the instant, `settlement.nothing_to_settle`) see exactly the same thing:
        nothing at all.

        The order is the schema's own - `settlement_cycles_by_group (group_id, created_at DESC)`, the index the
        migration created for this read - so a page is the group's most recently *asked for* cycles, which is what
        a member wants at the top after asking. Note that this is not `asOf` order: a cycle opened today for last
        quarter would otherwise appear halfway down a page of history, and the pair `(groupId, asOf)` is unique, so
        the tie-break by id is a formality rather than a reordering.

        `runId` is the plan over the cycle, or absent when none exists yet. It is a *fact* rather than a status -
        the run's own status lives on the run, where `GET /runs/{runId}` and the group's runs already serve it -
        and it is what lets a client say "asked, waiting since <createdAt>" instead of guessing. A cycle whose
        instant has passed and whose plan never appears is a visible anomaly in a list ordered by when it was
        asked, which is the honest way to report a situation this API cannot decide.

        **Membership is the condition, since ADR 0054** - a group the caller is not in is a `404` with the same code
        and the same reasoning as the group read (ADR 0043): telling "no such group" and "not yours" apart would let
        anybody holding a guess learn which ids are real. The paragraph that used to be here said the opposite, on the
        ground that groups are not tables in this build - true when it was written, and false since ADR 0043. What is
        still not here is a filter by "waiting": it would be a second ordering guarantee for a query whose only
        interesting question is "did my request become a plan", which the first page answers.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: |
            How many cycles one page may hold. The default is this contract's own for list endpoints and the
            maximum is the API's, for the reason the runs list states: an unbounded read is a read whose cost
            grows with a group's history, and a limit pretending to be paging is worse than a limit.
      responses:
        '200':
          description: Cycles, most recently opened first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SettlementCycle' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a group's books are read by its members (ADR 0054).
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/runs:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [settlement]
      summary: The group's settlement runs, newest first
      description: |
        What a member has to decide about. The order is the schema's own - `settlement_runs_by_group
        (group_id, created_at DESC)`, the index the migration created for exactly this read - so a page
        is the group's most recent cycles and a tie is broken by the run's id rather than by whatever
        order the rows came back in.

        Each row is the same `SettlementRun` the read endpoint serves, minus `transfers` (which that
        endpoint says are served separately): a member choosing whether to open a run needs to see what
        it moves, and a list row that carried only an id and a status would make the client fetch each
        one to draw a list. A separate summary schema was the alternative and it is the wrong shape -
        two ways to describe one run is the second implementation of "what a run is" that ADR 0021
        refuses, and the two would drift the first time a figure was added.

        **Membership is the condition, since ADR 0054** - a group the caller is not in is a `404` with the same code
        and the same reasoning as the group read (ADR 0043): telling "no such group" and "not yours" apart would let
        anybody holding a guess learn which ids are real. Two paragraphs left this description with the change. The
        first said there is no `404` because "groups are not tables in this build" - true when it was written and false
        since ADR 0043. The second said there is no `status` filter: **that one still stands**, because newest-first
        puts what needs answering at the top of any page and a filtered query would need its own ordering guarantee.
        It is one gap rather than two now, and the plan records it as one.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: |
            How many runs one page may hold. The default is this contract's own for list endpoints; the
            maximum is the API's, because an unbounded read is a read whose cost grows with a group's
            history. Paging older than a hundred runs needs a cursor, which this endpoint does not have
            yet - a limit pretending to be paging is worse than a limit.
      responses:
        '200':
          description: Runs, most recently created first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SettlementRun' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a group's books are read by its members (ADR 0054).
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /runs/{runId}:
    get:
      tags: [settlement]
      summary: Settlement run status and headline numbers
      description: |
        The run's status, its figures per currency, and every answer on the record. This is what a member
        reads before approving, so it says what the plan asks for rather than what it concludes.

        It does not say whether quorum is met. Quorum is the run's arithmetic over its own participants
        (ADR 0016), computed in the module that owns the run, and recomputing it in the API would be a
        second implementation that a member reads while the first one moves money (ADR 0021). The `status`
        is the state machine's answer instead: `awaiting_approval` and `awaiting_fx_funding` distinguish
        the two blockers a group has, people and currency.

        `answers` carries every stored answer, including any that cannot count; whether one counted is the
        run's judgement, not this response's.

        **Membership is the condition, since ADR 0054, and the refusal stays `no_such_run`.** A run belongs to a
        group, so reading one is reading that group's books - and the caller must be a member of the group the run
        settles. What is deliberately *not* changed is the code: a run that exists in a group the caller is not in
        answers exactly what a run id that matches nothing answers (`api.no_such_run`, `404`), because a second code
        for "not yours" would make this endpoint an oracle for which run ids are real - the same enumeration the group
        reads close with one answer for "no such group" and "not yours" (ADR 0043, 0044). The refusal's own message
        says both cases, because the code covers both.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /runs/{runId}/decisions:
    post:
      tags: [settlement]
      summary: Record a member's answer (quorum enforced server-side)
      description: |
        Records one member's answer - an approval or a refusal. The answer is stored where the run can
        read it, and the run's own arithmetic over its participants decides what it means: an approval
        counts toward quorum, and a refusal ends the run. So this operation answers `Decision recorded`
        rather than `Approved` or `Rejected`, and a `200` says nothing about what the run will do.

        A member has one answer per run: answering twice is a `409`, and the stored answer is never
        overwritten. Whether an answer counted is not visible here; `GET /runs/{runId}` is where a member
        sees the answers on the record, and a refusal's effect is visible in the run's `status` after the
        worker's next look - this operation records a row and does not move the run's lifecycle.

        The operation is named for the answer rather than for one of them, and the path was
        `/runs/{runId}/approve` until refusals were expressible. The request body keeps its meaning:
        an absent `decision` is an approval, so a client that sent the old body still sends what it
        meant.

        The answering member is **the caller**, resolved from the session (ADR 0053): this was the last
        operation whose *acting* member arrived in the body, and the boundary is now closed the same way
        the group writes closed theirs (ADRs 0043, 0047-0049). A request with no session is a `401`
        rather than an answer by nobody, and a caller who is not a member of the group whose books this
        run settles gets a `404` - `api.no_such_run` rather than `api.no_such_group`, since ADR 0054, because this
        route is addressed by a run and the refusal names only the id the caller sent: the wider code's own prose
        names the group it could not find, so an unauthenticated request holding a run uuid was told which group
        that run belonged to. Nobody answers on another
        member's behalf - there is no capability for it, so there is no field for it.

        It was deliberately last, and why it could wait is worth keeping: a stranger's answer was already
        inert by the quorum's arithmetic (ADR 0016), so the run's *outcome* never depended on this guard.
        What the guard changes is the record rather than the arithmetic - an answer is a row that the
        group's activity feed shows, so an unauthenticated request could put a line in a group's history,
        attributed to a member id it chose. That is the whole of what this closes, and it is more than
        "the status a stranger sees".
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /runs/{runId}/execute:
    post:
      tags: [settlement]
      summary: Ask for an approved run to be offered to the payment rail now
      description: |
        **This is a request, not an execution.** The transfers that move money are submitted by the settlement
        worker's driver, which offers a run to its rail on a cadence - so this records the member's intent on the run
        and the worker's next pass honours it. Nothing has moved when this answers, which is why the answer is `202`
        and its body is a receipt for what was written rather than a status.

        **It exists because the cadence already does this, and "now" is the part a member is missing.** A run whose
        rail has gone quiet waits out a backoff before it is tried again, which is the right behaviour for a system
        and a bad one for a person looking at a settlement that is stuck; asking is how a member cuts to the front of
        that wait. It is idempotent by construction rather than by a header: the request is a flag on the run, so a
        second request is the same request, and the attempt that honours it spends it. There is therefore no
        `Idempotency-Key` here, and its absence is deliberate - a key is a second identity for one intent.

        **Who may ask, and what is refused.** A member of the run's group, and only them: a caller who is not gets the
        `404` below, which is one answer for "no such run" and "not yours" (ADR 0049) - `api.no_such_run`, since
        ADR 0054, because the reader that authorises this request narrows by membership and a run-scoped route answers a
        run-scoped code. A run that cannot move is
        answered `409` - already `executing`, finished (`done`, `failed`, `rejected`), still being opened, or waiting
        on a group that has not approved enough of it. A run waiting on *currency* is **not** refused: the driver
        honours the request the moment the group brings the currency in, so the intent is worth recording rather than
        refusing, and this operation does not widen the contract's own `409`.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: |-
            Execution requested, and nothing has moved yet - this is a receipt for what was recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestedExecution' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |-
            Quorum not reached, or already executing. The same status for both because the diagnosis is the same: the
            run cannot be influenced by asking, and the problem body's `detail` carries the state it is in.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /runs/{runId}/transfers:
    get:
      tags: [settlement]
      summary: The who-pays-whom instruction list
      description: |
        Every movement the plan asks for, in a stable order derived from each transfer's own coordinates
        (`railRef`) rather than from insertion order - a plan whose reported order changed between two
        reads would make the plan a group approved and the plan a rail executed look different when they
        are the same.

        Served from the same read as `GET /runs/{runId}`, so the two endpoints cannot disagree about one
        plan - **including about who may read it.** Since ADR 0054 the caller must be a member of the group the run
        settles, and the refusal is the same `api.no_such_run` that read answers with: this endpoint serves the most
        sensitive part of the plan (who pays whom, and how much), so it is the last place that should be reachable by
        holding an id, and the one answer for a missing run and a stranger's run is what keeps run ids from being
        probed (ADR 0044).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Transfer instructions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferInstruction' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tax/reports:
    get:
      tags: [tax]
      summary: Tax report for a period, including savings versus pairwise settlement
      description: |
        The tax this group's settlement plans have **assessed**, per currency, over a period.

        **What is being reported, and what is not.** These figures are the plan's own - the per-currency columns a
        run stores when it is computed - because a plan's tax is `libs/netting`'s answer about the partition and
        re-deriving it here would mean running the engine again to read a run. So this is the tax the group's plans
        say it owes, not tax that has been collected: `docs/specs/tax-rules.md` section 7 leaves "are we a
        withholding agent" as an open legal question whose default posture is **compute and report**, and this
        endpoint is the reporting half of that posture. A figure here is never evidence that tax was remitted, and
        the schema has no field that could be read as one.

        **Which runs count.** Every run whose plan was computed, except the two that mean the plan did not happen:
        `rejected` (the group refused it) and `failed` (it was attempted and did not complete). That is the same
        reading the obligations list uses for a run that ended without settling - it *releases* what it held - so a
        refused plan's tax is released here too rather than counted as a cost. A run still `pending` or `computing`
        has no plan yet and contributes nothing, which is a fact rather than a filter.

        **What the period means.** `periodStart` and `periodEnd` are inclusive **days**, matched against the
        cycle's `as_of` rather than the run's creation: `as_of` is the instant the books were closed and the instant
        every rate and tax rule was resolved at (`docs/specs/tax-rules.md` section 4), so it is the date a tax
        belongs to. Both are optional, and omitting them reports everything the group has ever planned. The days are
        UTC, and the same stand-in the obligations list records applies here: the day belongs to the group, and a
        group's settlement timezone is nullable - the paragraph that used to be here said no group exists as a table
        in this build, which was true when it was written and false since ADR 0043.

        **Membership is the condition, since ADR 0054**, and this read is the one where the check had to be added
        rather than looked for: `groupId` arrives as a **query parameter** rather than as a path segment, so no rule
        about paths could have found it and no reader of the path list would have noticed it was missing. A group the
        caller is not in is a `404` with the same code and the same reasoning as the group read (ADR 0043): telling
        "no such group" and "not yours" apart would let anybody holding a guess learn which ids are real.

        **There is no headline figure, and the parameter list is why.** A single "tax owed" would have to be
        expressed in some currency, and adding rupees to yen is not addition (ADR 0012). The contract gives this
        operation no reporting currency, so it cannot be asked for one - and `docs/specs/tax-rules.md` section 6
        says the same thing from the other end: a reporting-currency figure is an estimate that must not be used to
        compute anything, and an endpoint with no way to ask for one cannot be misused as one. Every line carries
        its own currency, and `runCount` is there so a reader can see how many plans the line is made of.
      parameters:
        - name: groupId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: periodStart
          in: query
          description: The first day whose cycle instant is counted, inclusive.
          schema: { type: string, format: date }
        - name: periodEnd
          in: query
          description: The last day whose cycle instant is counted, inclusive of the whole of that day.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Tax report
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxReportLine' }
        '400': { $ref: '#/components/responses/Problem' }
        # Both arrived with the rule that a group's books are read by its members (ADR 0054).
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tax/rules:
    get:
      tags: [tax]
      summary: Active tax rules (reference data, no PII)
      description: |
        Which tax rules are in force **right now**, for the jurisdiction this deployment is configured with.

        **Why "now" and not an instant.** This is a reference read - what a group will be charged if it settles
        today - and it is the same call the reference rate read makes (ADR 0037). A past rule set is not askable
        through this endpoint and does not need to be: a run stores the figures its own assessment produced, so what
        a cycle was taxed under is a fact about the run rather than something a reader reconstructs from the rules
        table. That is also why this read and the settlement path cannot disagree about history - only one of them
        claims to know it.

        **The effective window is in force at this instant**, which is the same condition the recording and preview
        paths resolve a rule by, taken from the same expression rather than written a second time: a rule is in
        force when `effective_from <= now < effective_to`, with a null `effective_to` meaning unbounded. A read with
        its own copy of that condition is how a group comes to be shown a rule that its settlement did not use.

        **What a rule carries, and why.** The `params` object is the rule's own shape - `perTransferMinor` for
        `flat`, `rateBps` with optional `minMinor`/`maxMinor` for `advalorem`, `tiers` for `threshold`
        (`docs/specs/tax-rules.md` section 2) - and it is passed through rather than reinterpreted, because the
        shapes belong to the module that assesses them and a second model of them here would be a second thing to
        keep in step. `sourceRef` is the statute the rule encodes: the table requires it so that a rule can be
        defended to an auditor rather than only executed, and a read that omitted it would be a list of rates
        nobody could justify.

        **A `threshold` rule is listed even though nothing can assess it yet.** `libs/netting` implements flat, ad
        valorem and a no-tax rule, so a partition governed by a threshold rule cannot be netted at all - the
        settlement path refuses it rather than assessing zero, because no tax and low tax are indistinguishable in a
        report. Listing the row is the honest answer to "which rules are in force": the data exists, and hiding it
        would leave a reader staring at a settlement that refuses for a reason they cannot see. The schema carries no
        field saying which kinds are executable, which is recorded as a gap rather than guessed at here.
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxRule' }
        '400': { $ref: '#/components/responses/Problem' }

  /currencies:
    get:
      tags: [reference]
      summary: Currency reference data, including minor-unit exponents
      description: |
        Cached aggressively. A client needs the exponent to render a Money correctly (P1). The server
        deliberately does not repeat the exponent on every amount, because it is reference data.
      responses:
        '200':
          description: Currencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CurrencyInfo' }

  /fx/rates:
    get:
      tags: [fx]
      summary: Current reference rate (read-only, does not lock anything)
      description: |
        What the pair converts at, for a screen that is about to record a cross-currency commitment.

        **It is not the rate the obligation will be locked at.** The server locks its own quote from `fx_rates` at
        the obligation's own instant when the request arrives, so this number may differ - which is why the screen
        that shows it says "indicative" rather than promising a number a member can hold the group to.

        **It applies the same freshness policy as locking, and that is the decision** (ADR 0037). A pair whose most
        recent rate has already expired is answered `422 fx.rate_stale` rather than with a number: the question this
        endpoint answers is "can this be settled in another currency, and at about what rate", and a rate the server
        would refuse to lock answers a different one. Showing it would invite a member to fill in a form whose
        submission the recording path then refuses - the same refusal, arrived at later and after more work. The
        code is deliberately the recording path's own, so a client has one thing to branch on, and it is final
        rather than retryable: `503 fx.rate_unavailable` is the retryable one, for a pair with no rate at all.

        The response carries `quotedAt` and `expiresAt`, so a screen can say how old the rate it is showing is
        instead of presenting it as current.
      parameters:
        - name: base
          in: query
          required: true
          description: 'The currency being converted from: a code in the currency catalogue.'
          schema: { $ref: '#/components/schemas/Currency' }
        - name: quote
          in: query
          required: true
          description: |
            The currency being converted to: the one the creditor is paid in. A pair rather than one currency,
            because a conversion from a currency to itself is not a rate - it is refused rather than answered with
            one, since a fabricated identity rate is indistinguishable from a quoted one to everything downstream.
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Rate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRate' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  # There is no `POST /fx/quotes` here, and its absence is the decision rather than an accident (ADR 0046).
  #
  # A locked quote is created *by recording the commitment that needs it* - `POST /obligations` carries
  # `settleInCurrency` and locks the rate at that moment, returning the quote on the obligation it wrote - so a
  # standalone quote operation was a second, unserved door onto a capability that already existed in the one place
  # where the rate has meaning. What it promised: a rate that could be locked against an amount before anything was
  # recorded against it. What that would need: a quote lifecycle with expiry, binding and release, which this
  # deployment has nowhere to put - an unused locked quote is a rate risk with no owner (ADR 0013, point 5).
  #
  # The `FxQuote` schema stays, because the obligation still carries its quote; what has gone is the entry point.
  /webhooks/rails/{provider}:
    post:
      tags: [webhooks]
      summary: Rail status callback (signature-verified, idempotent)
      description: |
        **What a rail tells us asynchronously, and what this deployment does with it.** A callback is recorded, not
        applied: the row it writes is read by the settlement worker's driver, which prefers a delivered answer to a
        poll (ADR 0051) - so a rail that volunteers an answer is not asked to repeat itself, and the transfer's state,
        the run's fate and the ledger entry remain the worker's to decide. Nothing has moved when this answers.

        **Authentication is a signature rather than a session.** A rail has no member and no token, so this operation
        opts out of the global bearer scheme. What it requires instead is `X-Rail-Signature`: HMAC-SHA256 over the
        *exact bytes* of the body - never a re-serialisation of the parsed fields - keyed with the deployment's
        `reductxn.rails.webhook-secret`, formatted `sha256=<lowercase hex>`. A deployment with no secret configured
        refuses **every** callback with `401`: it cannot tell a callback from anybody else's POST.

        **Idempotency is the schema's, not a check.** The reference is the row's key, so a redelivery - which every
        rail sends, because a callback is an at-least-once signal - replaces the rail's word about that transfer rather
        than adding a second opinion about it. A rail may therefore retry until it sees this `202`.

        **A callback naming a reference no transfer was offered under is accepted, and does nothing.** The row is
        inert because nothing ever asks about that reference, and the alternative - this API checking the worker's own
        tables before writing to them - is the duplicated judgement ADR 0020 refuses. What that costs is one row per
        unknown reference; what it buys is that a forged-but-signed callback cannot move money, which is what the
        worker's test asserts.

        **What a `401` does not say.** A missing signature, a wrong secret and a body altered after signing are one
        code, because a caller's next step is the same in all three cases and because telling them apart would tell
        somebody probing this endpoint which half of their guess was right.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: |-
            Which rail is calling back. Recorded with the answer, and quoted in a refusal so a rail can be told which
            delivery of its own was dropped.
          schema: { type: string }
        - name: X-Rail-Signature
          in: header
          required: true
          description: |-
            `sha256=<lowercase hex>`, an HMAC-SHA256 of the body's exact bytes under the deployment's webhook secret.
            Verified before the body is parsed, so a request whose signature does not verify is never read.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailCallback' }
      responses:
        '202':
          description: |-
            Accepted and recorded. The transfer this is about has *not* moved yet - the settlement worker reads this
            answer on its next pass - so the body is a receipt for what was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RailCallbackReceipt' }
        '400':
          description: |-
            The signature verified and the body cannot be used: a missing field, a state outside the four this build
            acts on, or a body that is not the json below. The problem body names the field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: |-
            Invalid signature. Nothing about the request is trusted, including the provider in its path.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque session token from `POST /auth/otp/verify`, sent as `Authorization: Bearer <token>`.

        **This used to say `bearerFormat: JWT`, and it no longer does** (ADR 0042). The token has no structure to
        inspect: it is 256 random bits, stored as a hash, and looking one up is a key lookup in a `sessions` row. A JWT
        would need a signing key plus a story for rotating that key, and `POST /auth/refresh` needs a row to rotate either
        way - so statelessness would buy one indexed lookup and cost a key management problem this deployment does not
        have.

        **Declared globally, and read by every write that names a group.** Every path below requires this scheme unless
        it opts out with `security: []` - which the three auth operations do, and the rail webhook would if it were
        served. The boundaries that resolve a caller are `GET /me`, the three group operations, the void, the activity
        feed, the acceptance of an invitation, the two group-management writes and the two writes to a group's books
        (ADR 0042, 0043, 0045, 0047, 0048, 0049), and `POST /runs/{runId}/execute` (ADR 0050) - all but the first
        requiring a **member of the group**, which is asked of the group's own rows rather than taken from the request.

        **No count is given here on purpose.** An earlier version of this paragraph said "six boundaries so far", and
        the number was wrong within two slices - a fact about now is not a property of a document that changes, which is
        the lesson the coverage gate's own prose learned twice (ADR 0046). What remains true is the rule: a boundary
        that acts for somebody resolves that somebody from this scheme, and the one that does not is the decision
        endpoint, whose body still names its member - a gap recorded rather than implied.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }

    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Currency:
      type: string
      description: ISO 4217 code, or the CBDC ledger code for the jurisdiction
      example: INR

    Money:
      type: object
      description: Integer minor units. Never a floating-point value.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Amount in the currency's minor unit
          example: 400000
        currency: { $ref: '#/components/schemas/Currency' }

    CurrencyInfo:
      type: object
      description: Reference data for one currency. Fetched once and cached by the client.
      required: [code, minorUnitExponent]
      properties:
        code: { $ref: '#/components/schemas/Currency' }
        minorUnitExponent:
          type: integer
          minimum: 0
          maximum: 8
          description: Fractional digits. INR and RUB 2, JPY 0.
          example: 2
        isCbdc: { type: boolean }
        jurisdiction: { type: string, nullable: true }

    FxRate:
      type: object
      description: |
        A rate as a scaled integer (P12). `rateScaled / 10^rateScale` is the rate exactly; no
        floating-point representation exists anywhere in the system (ADR 0013).
      required: [base, quote, rateScaled, rateScale, quotedAt, expiresAt, source]
      properties:
        base: { $ref: '#/components/schemas/Currency' }
        quote: { $ref: '#/components/schemas/Currency' }
        rateScaled:
          type: integer
          format: int64
          example: 55904
        rateScale:
          type: integer
          minimum: 0
          maximum: 8
          example: 5
        midRateScaled:
          type: integer
          format: int64
          description: Provider mid rate, so the applied spread is disclosed rather than hidden.
        spreadBps: { type: integer }
        quotedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        source: { type: string, example: mock-provider }

    FxQuote:
      type: object
      description: |
        An immutable, locked conversion of one amount. Immutability is the point: the settlement rate
        is contractual and is never restated (ADR 0013, point 5).

        **Reachable only through the obligation that needs it.** There is no standalone quote operation,
        and that is deliberate (ADR 0046): a quote is locked by recording the commitment whose
        `settleInCurrency` differs from its amount, at which point it becomes contractual, and the
        obligation carries it back. A client that wants to show a member a rate before that point reads
        `GET /fx/rates`, which is indicative and says so.
      required: [id, rate, baseAmount, convertedAmount, residualScaled, residualScale, lockedAt]
      properties:
        id: { type: string, format: uuid }
        rate: { $ref: '#/components/schemas/FxRate' }
        baseAmount: { $ref: '#/components/schemas/Money' }
        convertedAmount: { $ref: '#/components/schemas/Money' }
        residualScaled:
          type: integer
          format: int64
          description: |
            Signed rounding residual, as the numerator of a fraction with `residualScale` as its
            denominator: residual = residualScaled / 10^residualScale. Always in [-0.5, 0.5) minor
            units of the quote currency, and booked to fx_clearing so value is conserved.
            Deliberately NOT a whole minor unit: the residual is genuinely fractional, and rounding
            it to an integer would silently lose or invent value (ADR 0013, docs/specs/fx.md s.4).
          example: -96
        residualScale:
          type: integer
          minimum: 0
          maximum: 16
          description: Denominator exponent for `residualScaled`. Rate scale plus any exponent shift.
          example: 3
        lockedAt: { type: string, format: date-time }
        railPerformedFx:
          type: boolean
          description: True when the rail performed the conversion (ADR 0013, point 8).

    CurrencyAmounts:
      type: object
      description: |
        Per-currency amounts. Totals are never collapsed into one number, because minor units of
        different currencies are not commensurable (ADR 0012).
      additionalProperties: { $ref: '#/components/schemas/Money' }
      example: { JPY: { amountMinor: 50000, currency: JPY }, INR: { amountMinor: 2795200, currency: INR } }

    FxRequirement:
      type: object
      description: |
        A currency the group must obtain from outside, because reductxn holds no currency (P2).
        Surfaced as a quantified obligation, never absorbed silently.
      required: [groupId, amounts]
      properties:
        groupId: { type: string, format: uuid }
        amounts: { $ref: '#/components/schemas/CurrencyAmounts' }
        reason:
          type: string
          enum: [clearing_residual, rounding_residual]
        satisfiableByRail: { type: boolean }

    Problem:
      type: object
      description: |
        RFC 9457 problem+json. `code` is the stable machine-readable identity of the error and is the
        only field a client should branch on or localize (RULE B20, ADR 0014). `title` and `detail`
        are English-only developer text, for logs and support, and are never rendered directly.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: |
            Stable error code, namespaced by the owning module, never translated. Lower case,
            dot-separated, at least one dot; first segment is the module. Examples:
            `ledger.currency_mismatch`, `fx.rate_stale`, `fx.amount_too_small_to_convert`,
            `settlement.fx_unfunded`. The namespace is what makes a collision impossible rather than
            unlikely, and what makes a code attributable in a log. Every code the server can emit is
            declared as a `public static final String CODE` on its exception, so the set is
            enumerable rather than a list somebody maintains by hand.
          example: fx.rate_stale
        params:
          type: object
          additionalProperties: true
          description: |
            Structured values for the client to interpolate into its localized message, so the
            server never has to compose prose. Amounts here are Money objects, never bare numbers.
          example: { pair: JPY/INR, quotedAt: '2026-09-25T10:04:00Z', maxAgeSeconds: 60 }

    TokenPair:
      type: object
      description: |
        A session: an access token for authenticated reads, and the refresh token that renews it.

        Both are opaque and are returned exactly once - the server stores only their hashes, so a lost pair is a new
        sign-in. `expiresIn` is the access token's remaining life in seconds; the refresh token's life is the session's and
        is not reported, because a client that needs it needs it to renew, and renewing is what tells it.
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds }

    RefreshRequest:
      type: object
      description: |
        The refresh token, so a rotation has something to rotate. Added by ADR 0042, because `POST /auth/refresh`
        declared no body and `security: []` means the bearer header is not where this token belongs.
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    User:
      type: object
      description: |
        Who a session speaks for.

        `displayName` is what this deployment calls them - which in a build with no profile screen is their phone number,
        because that is the only thing the deployment knows. A group's own name for them is
        `group_members.display_name`, and it is the one a person actually sees.

        `kycTier` is `none` for everybody here: there is no KYC provider, so no tier has been established. The value means
        "not established" rather than "established as nothing".
      required: [id, displayName, kycTier]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        kycTier: { type: string, enum: [none, basic, full] }

    ActivityEvent:
      type: object
      description: |
        One thing that happened in a group, derived from the row that recorded it rather than from a log.

        **Which fields a kind carries is stated rather than discovered.** `at` is always there, because it is what the order
        is built on; `memberId` and `displayName` are there whenever the row names a person; and exactly one of `role`,
        `decision` or `uses` is there, for the kind that has one. There is no `detail` string, deliberately: a server that
        composed prose would be rendering one language at a client that may be reading another (RULE B20, ADR 0014).

        - `member_joined`: `memberId`, `displayName`, `role` - the membership the group recorded.
        - `decision_recorded`: `memberId`, `decision` - an answer to a settlement run. `displayName` is absent, because
          `settlement_decisions` records who answered and not what the group calls them.
        - `invitation_created`: `uses` and `maxUses` - a code that exists, and how many times it has been spent. No member,
          because there is nobody the row names (ADR 0044).
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [member_joined, decision_recorded, invitation_created]
        at:
          type: string
          format: date-time
          description: When the thing happened, from the row's own column - never the read's clock.
        memberId:
          type: string
          format: uuid
          description: Who did it, when the row names somebody.
        displayName:
          type: string
          description: What the group calls them, when the row records it.
        role:
          type: string
          enum: [admin, member]
          description: The role the membership carries. Recorded and not enforced, like every role in this build.
        decision:
          type: string
          enum: [approve, reject]
          description: The answer a member gave a settlement run.
        uses:
          type: integer
          description: How many times an invitation code has been spent.
        maxUses:
          type: integer
          description: How many times it may be spent. Absent means unbounded, which is the invitations table's own rule.

    Group:
      type: object
      description: |
        A group: what it is called, what it settles in, and how many members it has.

        `memberCount` is counted from the memberships on every read rather than stored, so it cannot drift from the rows
        that are the fact.

        `settlementTimezone` is absent until the group chooses one: a default would decide which cycle an obligation falls
        in for a household somewhere else (ADR 0014, point 6), and "not chosen yet" is a state a client can act on - it is
        why the field is optional here.

        `maxMembers` is stored and **nothing consults it yet**: the members write serves every group id in this database,
        including the ones whose group has no row, so a cap it enforced would be a rule that applied to some groups and not
        others. It is recorded, like a member's `role`.

        `nettingPolicy` is not served. It exists in this schema and the sentence it would carry summarises a netting and
        default policy configuration this build does not have; a string composed from nothing would read as a decision
        somebody made (ADR 0043).

        The two currencies are ISO codes rather than objects: the exponent is reference data (`GET /currencies`), and
        `reportingCurrency` is presentational - it is what totals spanning currencies are stated in (ADR 0013).
      required: [id, name, currency, memberCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency:
          allOf: [{ $ref: '#/components/schemas/Currency' }]
          description: The group's default settlement currency.
        reportingCurrency:
          allOf: [{ $ref: '#/components/schemas/Currency' }]
          description: Currency for headline totals spanning currencies. Presentational only.
        settlementTimezone: { type: string, example: Asia/Kolkata }
        memberCount: { type: integer }
        maxMembers: { type: integer }
        nettingPolicy: { type: string, description: Summary of the group's netting and default policy }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      description: |
        A person the group has recorded as a member: what to call them, and the role the group gave them.

        No credit limit, which this schema used to promise as a `Money`. Nothing in this build sets one, nothing
        consults one, and a field that is always absent is a promise a client would wait for - so it comes back
        with the policy that enforces it rather than sitting here being null (ADR 0035, the same habit ADR 0033
        applied to `close`).
      required: [userId, displayName, role]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, member]
          description: |
            Recorded, not enforced. A build without identity has no admin whose word an `admin` row would weigh
            more than a member's, so the role is a fact the group agreed on and nothing consults it.

    MemberRequest:
      type: object
      description: |
        A membership to record. `role` defaults to `member`, because that is the ordinary case and asking every
        caller to say so would make the request longer without making it clearer - and because a build without
        identity has no use for an admin.
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
          description: The person, as the group's own record identifies them.
        displayName:
          type: string
          maxLength: 120
          description: What the group calls them. There is no users table to look a name up in, so this is the name.
        role: { type: string, enum: [admin, member], default: member }

    Invite:
      type: object
      description: |
        A code that lets somebody join a group: the code itself, when it stops working, and - when the deployment sets
        one - how many times it may be spent.

        `maxUses` is absent when there is no limit, which is what this deployment's creation operation produces: a code
        is stopped by its window rather than by a count. A client must read an absent `maxUses` as "no limit" rather
        than as zero, which is a value the table refuses precisely so the two cannot be confused.
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }

    InvitePreview:
      type: object
      description: |
        What an invite code is for: the group it joins somebody to, and the code's own terms.

        It carries no member names, no amounts and no commitments - a code says "you are invited to this group", and a
        preview that disclosed more than that would disclose a ledger nobody has joined yet (ADR 0054). It is also the
        one response in this document a **signed-out** caller can read, which is what makes the link flow work: the
        code is the capability, and the group chose to hand it out.
      required: [code, expiresAt, group]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        maxUses:
          type: integer
          description: |
            How many times the code may be spent, or absent for no limit - the same absent-means-unlimited reading
            `Invite.maxUses` requires.
        group:
          type: object
          description: |
            The group the code joins somebody to, as much of it as somebody who has not joined is entitled to know.
          required: [id, memberCount]
          properties:
            id: { type: string, format: uuid }
            name:
              type: string
              description: |
                The group's name, or absent for a group that exists only as rows: `group_members` and `invitations`
                write a bare uuid, and a group with members and no `groups` row of its own is a state this build
                contains (ADR 0043). A client shows the id instead, which is the fallback its group layout makes for
                the same reason.
            memberCount:
              type: integer
              description: How many members the group has now, including anybody who joined with this same code.

    AcceptInvite:
      type: object
      description: |
        What somebody joining supplies, which is now only what the group will call them.

        The joiner is the caller, so the `userId` this schema used to carry is gone: it was an assertion the server had
        nothing to check against (the identity gap, ADR 0020, 0041), and the acceptance is about the session now (ADR
        0042). There is no `role` either - accepting joins as an ordinary member, because a code that conferred `admin`
        would be a privilege handed out by a default rather than decided by somebody.
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 120
          description: What the group will call them - the same field, and the same limit, as recording a member.

    Obligation:
      type: object
      description: |
        A commitment, not a money movement. When `settleInCurrency` differs from `amount.currency`
        the obligation is cross-currency and carries a locked `fxQuote`, so the creditor is promised
        a concrete amount at recording time (ADR 0012, 0013).
      required: [id, groupId, debtorId, creditorId, amount, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        debtorId: { type: string, format: uuid }
        creditorId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        settleInCurrency:
          allOf: [{ $ref: '#/components/schemas/Currency' }]
          description: |
            What the creditor is to receive. Defaults to `amount.currency`. When different, `fxQuote`
            is required.
        fxQuote: { $ref: '#/components/schemas/FxQuote' }
        memo:
          type: string
          description: |
            Free text authored by a member. User content: never translated, never parsed for meaning,
            never used to derive a code (ADR 0014).
        status: { type: string, enum: [open, netted, settled, voided] }
        occurredAt: { type: string, format: date-time }

    NetPosition:
      type: object
      required: [userId, direction, net]
      properties:
        userId: { type: string, format: uuid }
        direction: { type: string, enum: [pay, receive, flat] }
        net: { $ref: '#/components/schemas/Money' }

    TransferInstruction:
      type: object
      required: [fromUserId, toUserId, amount, status]
      properties:
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        toAccountType:
          type: string
          enum: [member, fx_clearing]
          description: |
            `fx_clearing` marks the leg that crosses currencies, so the FX cost of a plan is visible
            in the report rather than hidden inside a member's transfer (ADR 0012).
        amount: { $ref: '#/components/schemas/Money' }
        tax:
          $ref: '#/components/schemas/Money'
          description: |
            Not populated, and not required any more. The worker stores tax per currency rather than per
            movement: the plan's tax figure and what netting saved are partition columns, because the
            saving is a property of netting rather than of any one payment (ADR 0021). Splitting a
            partition's tax across its transfers would be the API inventing an arithmetic the worker never
            ran. The tax a group reads is on the run summary, per currency.
        status:
          type: string
          enum: [pending, authorized, submitted, confirmed, failed]
        fxLinkId:
          type: string
          format: uuid
          nullable: true
          description: |
            Not populated: the pairing this field describes is a ledger fact, recorded on the entries a
            confirmed transfer books, not a column of the transfer row. Read it through the ledger.
        railRef: { type: string, nullable: true }
        failureCode:
          type: string
          nullable: true
          description: |
            Not populated: the transfer row carries what the rail said (`failureReason`) and no stable
            machine-readable code. A code a client could branch on would be worth having, and nothing
            writes one yet.
        failureReason:
          type: string
          nullable: true
          description: English developer text for logs and support. Never rendered directly.

    NettingPreview:
      type: object
      description: |
        A what-if preview. In a multicurrency group the per-currency partitions are authoritative,
        and `reportingTotals` collapses them for display only (ADR 0012, 0013).
      required: [bestCase, partitions]
      properties:
        currency:
          allOf: [{ $ref: '#/components/schemas/Currency' }]
          description: Present when the preview covers a single currency. Absent for a multicurrency preview.
        grossTransferCount: { type: integer, deprecated: true, description: Use `partitions`. }
        netTransferCount: { type: integer, deprecated: true, description: Use `partitions`. }
        grossTax: { $ref: '#/components/schemas/Money' }
        netTax: { $ref: '#/components/schemas/Money' }
        taxSaved: { $ref: '#/components/schemas/Money' }
        partitions:
          type: array
          items:
            type: object
            required: [currency, grossTransferCount, netTransferCount, grossTax, netTax, taxSaved]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              grossTransferCount: { type: integer }
              netTransferCount: { type: integer }
              grossTax: { $ref: '#/components/schemas/Money' }
              netTax: { $ref: '#/components/schemas/Money' }
              taxSaved: { $ref: '#/components/schemas/Money' }
              algorithm: { type: string, enum: [greedy, subset_partition, mip, pairwise] }
        reportingTotals:
          type: object
          properties:
            currency: { $ref: '#/components/schemas/Currency' }
            taxSaved: { $ref: '#/components/schemas/Money' }
            fxCost: { $ref: '#/components/schemas/Money' }
            rateAsOf: { type: string, format: date-time }
        sameCurrencyAlternative:
          type: object
          description: |
            What the cycle would have cost had every obligation been recorded in one currency. Lets
            the product state the cost of the currency choice, not only the saving from netting.
          properties:
            currency: { $ref: '#/components/schemas/Currency' }
            tax: { $ref: '#/components/schemas/Money' }
            delta: { $ref: '#/components/schemas/Money' }
        fxRequirements:
          type: array
          items: { $ref: '#/components/schemas/FxRequirement' }
        provablyOptimal: { type: boolean }
        bestCase:
          type: object
          properties:
            positions:
              type: array
              items: { $ref: '#/components/schemas/NetPosition' }
            transfers:
              type: array
              items: { $ref: '#/components/schemas/TransferInstruction' }

    DecisionRequest:
      type: object
      description: |
        One member's answer. The answering member is the caller, resolved from the session (ADR 0053), so
        the body names nobody: an answer has one author and a request cannot claim to be somebody else's.
        An absent body is an approval, which is what this operation meant before refusals were expressible
        - the field that made a body necessary was the member's id, and it is gone.
      properties:
        decision:
          type: string
          enum: [approve, reject]
          description: |
            The answer. Absent means `approve`, which is what this operation meant before refusals were
            expressible, so a request that omits it is still the request it always was.

            A word outside this enum is refused by the run's own rows with a `422`, not passed through:
            the vocabulary is the run's, fixed by the migration's check constraint and read by the run's
            quorum, and this API holds no copy of the list to validate against.

    Decision:
      type: object
      description: |
        An answer as it now stands on the record. There is no `counted` field, deliberately: whether an
        answer reaches quorum - or ends the run - is the run's arithmetic over its own participants,
        computed in the module that owns the run, and a boolean here would be this API answering a
        question it does not compute. A refusal's effect is visible in the run's `status` once the worker
        has looked at it.
      required: [runId, memberId, decision, recordedAt]
      properties:
        runId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        recordedAt: { type: string, format: date-time }

    RailCallback:
      type: object
      description: |
        What a rail sends when it has something to say about a transfer, without being asked.

        `railRef` is the reference the transfer was offered under (RULE S2) - the rail's idempotency key and, here, the
        identity of the row this writes. `state` is the rail's word, and the four below are the whole vocabulary this
        build acts on: a fifth is refused with `400` rather than stored, because the worker maps a stored word to a
        transfer's state exhaustively and a word it could not map would reach the rows as a question (ADR 0051).

        `detail` is the rail's own text about why, passed through and never interpreted: it lands in the transfer's
        `rail_detail`, which is where a person reading a run finds the rail's own account. It may be absent, and a
        callback that says only `confirmed` has still said everything it needs to.
      required: [railRef, state]
      properties:
        railRef:
          type: string
          description: The reference this deployment offered the transfer under.
        state:
          type: string
          enum: [accepted, pending, confirmed, failed]
          description: |-
            `accepted` and `pending` both mean the rail holds the instruction and has not confirmed it; `confirmed` is
            money moved; `failed` is the rail saying it will not move.
        detail:
          type: string
          description: The rail's own words about why. Stored as it arrived, never derived here.

    RailCallbackReceipt:
      type: object
      description: |
        The acknowledgement: what this deployment now holds, which is what the rail just told it plus the instant it
        holds it under. It is not a status - whether the money moved is a question about the transfer, and
        `GET /runs/{runId}` is where it is answered.

        The state is echoed so a rail can see what was recorded rather than only that something was, and `receivedAt`
        is how it acknowledges a delivery without replaying it.
      required: [provider, railRef, state, receivedAt]
      properties:
        provider: { type: string }
        railRef: { type: string }
        state:
          type: string
          enum: [accepted, pending, confirmed, failed]
        receivedAt: { type: string, format: date-time }

    RequestedExecution:
      type: object
      description: |
        A member's request for a run to be offered to a rail, as it was recorded - a receipt rather than a status.

        Nothing has moved when a client sees this. The request is a flag on the run that the settlement worker's driver
        reads on its next pass, and `requestedAt` is the boundary's clock at the moment it was written (ADR 0050).
        Whether the money moved is a question about the run, and `GET /runs/{runId}` is where it is answered - the same
        split as this contract's other writes: an answer says what was recorded, and a read says what is true.

        `requestedBy` is the member from the session, and it is kept on the run after the request is spent. The flag is
        pending intent; the attribution is a fact about the run's history.
      required: [runId, requestedBy, requestedAt]
      properties:
        runId: { type: string, format: uuid }
        requestedBy:
          type: string
          format: uuid
          description: The member who asked, from the session.
        requestedAt: { type: string, format: date-time }

    SettlementCycle:
      type: object
      description: |
        A closed period of a group's books, as `settlement_cycles` stores it (ADR 0032). It is four facts and
        no status of its own: a cycle is a claim about an instant rather than a state machine, and whether it
        has been computed is a question about a *run* - which this schema answers with `runId` and which the
        runs endpoints answer with the plan's status and figures.

        `asOf` is the cycle's identity along with the group - one cycle per group per instant - and it is the
        instant every rate, tax rule and commitment in it is resolved at. `createdAt` is when somebody asked
        for it, which is what a client shows as "waiting since" when the plan has not been computed yet.
      required: [id, groupId, asOf, createdAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        asOf:
          type: string
          format: date-time
          description: The instant the books were closed at, and the instant the cycle settles as of.
        createdAt:
          type: string
          format: date-time
        runId:
          type: string
          format: uuid
          nullable: true
          description: |
            The plan computed over this cycle, or absent when none exists yet. A cycle the worker has not
            computed (`workers/settlement`'s cadence, within a minute) and a cycle it refused
            (`settlement.nothing_to_settle`, because the group has nothing recorded at or before `asOf`)
            are both absent here, and that is deliberate: telling them apart would mean recording a
            refusal, which is a decision this schema does not have the facts to make.


    SettlementRun:
      type: object
      description: |
        One run per (group, cycle), containing one partition per currency present. Per-currency
        figures are authoritative; `reportingTotals` is presentational and restatable
        (ADR 0012, 0013).
      required: [id, cycleId, groupId, status]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, computing, awaiting_approval, awaiting_fx_funding, executing, done, failed, rejected]
        partitions:
          type: array
          description: One entry per currency. Authoritative figures live here.
          items:
            type: object
            required: [currency, gross, net, tax, taxSaved, transferCount]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              gross: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }
              tax: { $ref: '#/components/schemas/Money' }
              taxSaved: { $ref: '#/components/schemas/Money' }
              transferCount: { type: integer }
              algorithm: { type: string, enum: [greedy, subset_partition, mip, pairwise] }
        reportingTotals:
          type: object
          description: |
            Headline figures in the group's reporting currency, using a reporting rate. An estimate,
            never a ledger figure, and never used to compute a transfer or an assessment.

            Not populated: the reporting currency is a group's property - a row that exists since ADR 0043,
            which the run's projection does not read - and a total without a rate as-of is a number nobody
            could restate (ADR 0021).
          properties:
            currency: { $ref: '#/components/schemas/Currency' }
            tax: { $ref: '#/components/schemas/Money' }
            taxSaved: { $ref: '#/components/schemas/Money' }
            fxCost: { $ref: '#/components/schemas/Money' }
            rateAsOf: { type: string, format: date-time }
        fxRequirements:
          type: array
          description: |
            Currencies the group must obtain from outside. Empty means the run is internally
            settlable. Non-empty puts the run in `awaiting_fx_funding` (ADR 0012, RULE S4).

            Not populated: the requirement is derived by the settlement worker from the plan's clearing
            residual, and re-deriving it in the API would be a second implementation of the same rule
            (ADR 0021). The currencies involved are visible as transfers whose `toAccountType` is
            `fx_clearing`.
          items: { $ref: '#/components/schemas/FxRequirement' }
        computedAt: { type: string, format: date-time, nullable: true }
        executedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Not populated: nothing records the instant a run reached `done`. The run's `drivenAt` - when
            the driver last looked at it - is a different fact, and using it here would answer a question
            nobody asked.
        answers:
          type: array
          description: |
            Every member's answer, as the run's decision rows hold it - including answers that cannot
            count, because the run's arithmetic intersects them with its own participants (ADR 0020). No
            entry is marked as counted: whether an answer counted is the run's judgement, and a boolean
            here would be the API guessing (ADR 0021). Whether it was enough is in `gates`.
          items:
            type: object
            required: [memberId, decision, decidedAt]
            properties:
              memberId: { type: string, format: uuid }
              decision: { type: string, enum: [approve, reject] }
              decidedAt: { type: string, format: date-time }
        gates:
          $ref: '#/components/schemas/RunGates'

    RunGates:
      type: object
      description: |
        What the run's gates concluded, the last time the settlement worker looked at it (ADR 0023).

        Every field is the worker's arithmetic, stored where the API can project it: whether a quorum
        exists, how many approvals it counted and how many it needs, and what each currency is still
        short of. The API does not recompute any of it - the run's participants are not even published
        here - so a client that says "one approval short" is reading the worker's own answer rather than
        repeating its rule.

        Absent until the worker has looked at the run: "nobody has concluded anything" and "the gates are
        satisfied" are different facts, and a reader that answered the first with the second would be
        inventing a verdict.
      required: [concludedAt, status, quorum, funding]
      properties:
        concludedAt:
          type: string
          format: date-time
          description: |
            When the worker last read these gates - not when it first reached this verdict, because the
            conclusion is refreshed on every look. Its age is how current the verdict is.
        status:
          type: string
          description: |
            The run's status when the gates were read. A conclusion outlives its run: a run that was
            waiting when the worker looked and has since finished keeps the verdict it had, so a client
            compares this with the run's own `status` to tell a current conclusion from a stale one.
        quorum:
          type: object
          description: |
            RULE S1's verdict, with the counts that explain it. `counted` against `required` is how far
            off a quorum the group is, and `debtorsStillToConfirm` is why a run with enough approvals can
            still be waiting: every member who owes a net amount must confirm personally.

            Which member is not here - the run's members are its positions, and this read model does not
            publish them yet.
          required: [met, counted, required, debtorsStillToConfirm]
          properties:
            met: { type: boolean }
            counted: { type: integer }
            required: { type: integer }
            debtorsStillToConfirm: { type: integer }
        funding:
          type: object
          description: |
            RULE S4's verdict: whether the group has brought in the currency the plan needs. `outstanding`
            is per currency and never summed - nothing adds rupees to yen (ADR 0012) - and a currency that
            is covered is absent from it rather than present as a zero, so the list is what the group still
            has to do.
          required: [satisfied, outstanding]
          properties:
            satisfied: { type: boolean }
            outstanding:
              type: array
              items:
                type: object
                required: [currency, amountMinor]
                properties:
                  currency: { $ref: '#/components/schemas/Currency' }
                  amountMinor: { type: integer, format: int64 }

    TaxRule:
      type: object
      description: |
        One tax rule as configured: a rate for a (jurisdiction, currency) over an effective window. Data rather
        than code - adding a jurisdiction is an insert, never a release (ADR 0006).

        `params` is the rule's own shape and its keys depend on `kind`; the rules read documents the three shapes.
        It is passed through rather than flattened into named fields because the shapes belong to the module that
        assesses them. `sourceRef` names the statute the rule encodes, which is what makes a rate defensible to an
        auditor rather than merely executed.

        `effectiveFrom` and `effectiveTo` are **instants**, not days, because that is what a rule takes effect at
        and what the settlement path compares - reporting a window as a date would lose the boundary a group's tax
        turns on. `effectiveTo` is present and null when the rule is unbounded, which is why this property is
        declared `nullable` rather than left for a client to infer from an absent key.
      required: [id, jurisdiction, currency, kind, params, effectiveFrom, sourceRef]
      properties:
        id: { type: string, format: uuid }
        jurisdiction: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        kind: { type: string, enum: [flat, advalorem, threshold] }
        params:
          type: object
          description: The rule's parameters; the keys depend on `kind`.
          additionalProperties: true
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        sourceRef: { type: string }

    TaxReportLine:
      type: object
      description: |
        One currency's assessed tax for a period: the plan figures of every run the group computed in it, summed
        per currency and never across currencies (ADR 0012).

        `netTax` is the tax the plans assess and `taxSaved` is what netting avoided against settling every
        commitment pairwise; `grossTax` is the two added back together, which is the cost pairwise settlement would
        have incurred. Those three are the same three figures a run reports per partition, so a line over one run is
        that run's row.

        `runCount` is how many plans the line is made of - the field that lets a reader tell one run's report from a
        quarter's, and the reason this is a report about plans rather than about money that moved: nothing here has
        been remitted (`docs/specs/tax-rules.md` section 7).
      required: [currency, grossTax, netTax, taxSaved, runCount]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        grossTax: { $ref: '#/components/schemas/Money' }
        netTax: { $ref: '#/components/schemas/Money' }
        taxSaved: { $ref: '#/components/schemas/Money' }
        runCount: { type: integer }
