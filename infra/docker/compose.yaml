# Local development stack. Not for production.
# Reported table ownership follows MASTER-PLAN.md section 5.5.

name: reductxn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reductxn
      POSTGRES_USER: reductxn_app
      POSTGRES_PASSWORD: reductxn_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reductxn_app -d reductxn"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PgBouncer is deliberately present in the local stack: connection management is the
  # first thing to break at scale, so developers should feel it locally too.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: reductxn_app
      DB_PASSWORD: reductxn_local_only
      DB_NAME: reductxn
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka-compatible broker. Consumers project balances and drive settlement jobs.
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Report and export storage.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: reductxn
      MINIO_ROOT_PASSWORD: reductxn_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  minio-data:
