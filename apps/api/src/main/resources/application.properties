spring.application.name=reductxn-api

# Framework errors (404, 405, 400) as RFC 9457 too. Without this, some of them are answered with Spring's
# own body, and an error body that is not a problem is prose a client cannot branch on (RULE B20).
spring.mvc.problemdetails.enabled=true

# --- Data access -----------------------------------------------------------------------------------
#
# The pooler sits in front of the database in every environment including local
# (infra/docker/compose.yaml), so the application connects through PgBouncer on 6432. Flyway connects to
# Postgres directly on 5432: DDL on a transaction-pooled connection is the one thing the pooler cannot be
# relied on to carry. Both defaults are the local compose stack; a deployment overrides them from its own
# environment, which is why every one of them is a placeholder rather than a literal.
spring.datasource.url=${REDUCTXN_DB_URL:jdbc:postgresql://localhost:6432/reductxn}
spring.datasource.username=${REDUCTXN_DB_USER:reductxn_app}
spring.datasource.password=${REDUCTXN_DB_PASSWORD:reductxn_local_only}

# Flyway's credentials are separate from the DataSource's, and must be given. Setting spring.flyway.url
# stops Flyway reusing the DataSource, so it does NOT fall back to the username and password above - it
# tries to authenticate with none and the server answers "SCRAM-based authentication, but no password was
# provided". Not a guess: that was the first thing the integration tests hit.
spring.flyway.url=${REDUCTXN_DB_DIRECT_URL:jdbc:postgresql://localhost:5432/reductxn}
spring.flyway.user=${REDUCTXN_DB_USER:reductxn_app}
spring.flyway.password=${REDUCTXN_DB_PASSWORD:reductxn_local_only}

# --- Migrations ------------------------------------------------------------------------------------
#
# Both deployables share one schema and therefore one `flyway_schema_history` (RULE B17 gives each owner a
# version range rather than a schema of its own), and neither can see the other's migration files: `apps/api` may
# not depend on `workers/settlement` and the worker may not depend on `apps/api` (RULE B6). Flyway validates the
# history against the *classpath*, so whichever deployable starts second found the other's rows and refused:
#
#   Validate failed: Migrations have failed validation
#   Detected applied migration not resolved locally: 501, 502, ...
#
# **What was tried first, and did not work.** `spring.flyway.ignore-migration-patterns=*:missing` is the documented
# answer to exactly that message, the token is one Flyway accepts (its own error for a bad one lists
# `[*, missing, pending, ignored, future]`), and it had no effect on either the file or the command line with
# Flyway 12.4.0 under Spring Boot 4.1.1: the same validation failure, unchanged. So the property is not used here
# rather than left in as decoration - a setting that looks like it is holding a door shut is worse than none.
#
# **What is used instead**, and it is blunt: no validation against the classpath at the start, plus out-of-order
# so the second deployable may apply versions below the first one's high-water mark (the worker owns 5xx, so an
# API starting second applies 1xx under 513). What that costs, stated rather than hidden: a checksum change to an
# *already applied* migration is no longer caught at startup, and neither is a migration deleted from this
# deployable's own range - which is why `MigrationsConfigurationTest` and the module tests exist.
#
# The alternatives were a history table per deployable, which cannot work while `libs/*` ranges (2xx/3xx/4xx) are
# on both classpaths and would be applied twice, and a schema per deployable, which is a real architectural change
# (the API's obligation read joins the worker's tables in one schema). Both are bigger than this slice and neither
# is obviously right, so this is the honest minimum that makes a fresh checkout run both deployables - and it is
# named to the user as the change that deserves a decision rather than a quiet property.
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# --- Tax -------------------------------------------------------------------------------------------
#
# Which jurisdiction's rules apply, resolved by (jurisdiction, currency, effective date) per ADR 0006.
# Required with no default on purpose: a deployment that has not been told its jurisdiction would resolve
# no rule, and no tax looks exactly like low tax. Nothing records a group's jurisdiction yet - section 5.5
# has `groups` owned by this module - so this is a deployment property until it becomes a group column.
reductxn.tax.jurisdiction=${REDUCTXN_TAX_JURISDICTION}


# --- Rates -----------------------------------------------------------------------------------------
#
# Rate ingestion (ADR 0027). The provider's document is read on a schedule into libs/fx's fx_rates, which is
# where every conversion reads its rate from - so this is what makes a cross-currency obligation possible at
# all. `reductxn.rates.feed` is deliberately unset rather than defaulted: a deployment with no provider ingests
# nothing, starts normally, and answers every cross-currency request with fx.rate_unavailable, which is the
# fail-closed behaviour rather than a broken one. The refresh job exists only when it is set.
#
# Set it to the provider's document, or to a path an ops process has already fetched it to:
#   reductxn.rates.feed=${REDUCTXN_RATES_FEED:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
#   reductxn.rates.feed=${REDUCTXN_RATES_FEED:/var/lib/reductxn/rates/eurofxref-daily.xml}
#
# How old a published rate may be when a client locks a quote. Four days rather than minutes because this
# provider publishes on working days only: Friday's rate is the most recent one until Monday afternoon, and a
# shorter bound would refuse every cross-currency obligation over a weekend while the provider behaves
# perfectly. A streaming provider would set seconds here, which is why it is a deployment property rather than a
# constant beside the rate.
reductxn.rates.max-age=${REDUCTXN_RATES_MAX_AGE:P4D}
#
# How often the feed is read, and how soon after startup. Six hours is shorter than a day on purpose - a new
# publication should be read on the day it is published - and a repeat writes nothing, because a publication
# already recorded conflicts with itself (V403). The first pass is thirty seconds after startup rather than one
# interval later: a deployment that waited six hours for its first rate would refuse every cross-currency
# obligation it received in the meantime.
reductxn.rates.refresh=${REDUCTXN_RATES_REFRESH:PT6H}
reductxn.rates.refresh-initial=${REDUCTXN_RATES_REFRESH_INITIAL:PT30S}


# --- Rails -----------------------------------------------------------------------------------------
#
# The secret this deployment's rail signs its callbacks with (ADR 0051). Every other way into this API is a member's
# session; a rail has no session, so `POST /webhooks/rails/{provider}` authenticates a request by an HMAC-SHA256
# signature over the raw body (`X-Rail-Signature: sha256=<hex>`), computed with this secret.
#
# Unset means *every* callback is refused with 401, and that is the fail-closed default rather than an oversight: a
# deployment that has not been told what its rail signs with cannot tell a callback from anybody else's POST. It is
# the same shape `reductxn.rates.feed` has - unset ingests nothing rather than accepting everything - and it means a
# half-configured deployment says so in a response rather than by acting on an unverified claim about money.
#
#   reductxn.rails.webhook-secret=${REDUCTXN_RAIL_WEBHOOK_SECRET}
reductxn.rails.webhook-secret=${REDUCTXN_RAIL_WEBHOOK_SECRET:}
